spring:
  application:
    name: flight-ops-service

  # Default profile: in-memory H2, Hibernate owns the schema and demo data is seeded
  # on boot, so `./mvnw spring-boot:run` works with no setup.
  datasource:
    url: jdbc:h2:mem:flightops;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      # H2's spelling of the postgres profile's 3s lock_timeout, so local runs and
      # tests bound a lock wait the way production does.
      connection-init-sql: SET LOCK_TIMEOUT 3000

  jpa:
    hibernate:
      ddl-auto: create-drop
    # Off, so a lazy load during JSON serialisation fails instead of hiding an N+1
    # outside any @Transactional boundary.
    open-in-view: false
    properties:
      hibernate:
        # No jdbc.batch_size: every entity uses GenerationType.IDENTITY, which
        # disables JDBC insert batching, and a request inserts one booking.
        format_sql: true

  flyway:
    # Migrations are PostgreSQL-specific; H2 uses Hibernate's generated schema.
    enabled: false
    postgresql:
      # For the postgres and prod profiles, which switch Flyway on. By default
      # Flyway takes its lock with pg_try_advisory_xact_lock, in a transaction
      # it holds open on a second connection while each migration runs. V11's
      # CREATE INDEX CONCURRENTLY runs outside a transaction and waits for older
      # transactions to finish, so Flyway should not keep one of its own open
      # beside it. false takes a session-level lock instead, on the one
      # connection that runs the migrations, and a second instance starting at
      # the same time still waits its turn.
      transactional-lock: false

  jackson:
    deserialization:
      # A fractional seat count is a client bug, not a request for fewer seats.
      accept-float-as-int: false
    mapper:
      # So is a count sent as a string. The schema says integer; "2" is refused too.
      allow-coercion-of-scalars: false
    datatype:
      enum:
        # Otherwise {"status": 4} is read as the fifth constant, CANCELLED.
        fail-on-numbers-for-enums: true

  data:
    web:
      pageable:
        # Pages serialise as PagedModel, {content, page}. The default dumps PageImpl,
        # which Spring Data warns is not a stable JSON contract.
        serialization-mode: via-dto
        # Spring Data's own cap is 2000. It clamps rather than rejecting, so ?size=500
        # returns 200 with 100 rows; two pages cover a full 180-seat flight.
        max-page-size: 100

  threads:
    virtual:
      enabled: true

  servlet:
    multipart:
      # The API takes no uploads. With parsing on, DispatcherServlet reads any
      # multipart Content-Type before routing, and a missing boundary is a 500.
      enabled: false

  # Boot's default, pinned because deploy/k8s/base/deployment.yaml depends on
  # it:
  #   5s preStop + 30s drain = 35s < terminationGracePeriodSeconds: 45.
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  # The OpenTelemetry starter brings a push registry that publishes to
  # localhost:4318 every minute, collector or not. Metrics are served at
  # /actuator/prometheus for a scraper to pull instead. Trace export is opt-in
  # already, through
  # management.opentelemetry.tracing.export.otlp.endpoint.
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Splits /actuator/health into /liveness and /readiness for Kubernetes.
      probes:
        enabled: true
      # Anyone sees the status; only a caller in role OPS sees the components.
      # Without `roles`, any valid credential, the api user's included, would.
      show-details: when-authorized
      roles: OPS
      group:
        # db is in readiness and not in liveness. A database outage should take pods
        # out of the Service, not restart them: a restart cannot fix the database,
        # and every replica would fail liveness at once and restart in a loop.
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

app:
  security:
    # Encoded passwords with a {id} prefix, read by a DelegatingPasswordEncoder; see
    # ApiSecurityProperties. {noop} marks these local values as unhashed and not
    # secret. A deployment sets {bcrypt} hashes, and prod has no defaults.
    #
    #   curl -u api:dev-secret  ...   # /api/v1/**
    #   curl -u ops:dev-ops     ...   # /actuator/metrics, /actuator/prometheus
    api-password: "${API_PASSWORD:{noop}dev-secret}"
    ops-password: "${OPS_PASSWORD:{noop}dev-ops}"

  # Bearer tokens are off: SecurityConfig adds a resource server only when Boot
  # creates a JwtDecoder, and nothing here configures one. To accept them, set both:
  #
  #   spring.security.oauth2.resourceserver.jwt.issuer-uri: https://your-idp.example.com/
  #   spring.security.oauth2.resourceserver.jwt.audiences: [flight-ops-service]
  #
  # issuer-uri alone checks the signature, issuer and lifetime, so it accepts a
  # token the same issuer minted for another client in the tenant. `audiences` has
  # been a Boot property since 2.7; it installs a JwtClaimValidator for the aud
  # claim inside the decoder. See SECURITY.md.
  events:
    # log | sqs: which EventPublisher is wired in. sqs also needs SQS_QUEUE_URL,
    # or SqsEventPublisher stops startup.
    publisher: ${APP_EVENTS_PUBLISHER:log}
  outbox:
    # Runs on every replica; SKIP LOCKED in the claim makes that safe without a leader.
    enabled: ${OUTBOX_ENABLED:true}
    # Milliseconds between drains. A healthy event waits about this long at most.
    poll-interval: ${OUTBOX_POLL_INTERVAL:1000}
    # Rows claimed per drain; bounds how long one replica holds the row locks.
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    # Failures before a row stops being claimed. The claim is ORDER BY id, so a row
    # that always fails would otherwise be retried first each time its backoff ends,
    # forever. A row past the limit counts in the outbox.dead gauge, and this brings
    # it back:
    #   UPDATE outbox_events SET attempts = 0, next_attempt_at = NULL WHERE id = ?
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}
    # The first retry delay, doubling up to the ceiling. Ten attempts then span about
    # 13.5 minutes (810s), so a short SQS outage does not dead-letter healthy rows.
    # Zero disables the wait; only a test wants that.
    retry-backoff: ${OUTBOX_RETRY_BACKOFF:2s}
    max-retry-backoff: ${OUTBOX_MAX_RETRY_BACKOFF:5m}
    # How long a published row is kept before OutboxPruner deletes it. Unpublished
    # rows are never pruned.
    retention: ${OUTBOX_RETENTION:7d}
    # The pruner and the drain are both fixed-delay jobs. The application defines no
    # TaskScheduler, and Boot's default runs fixed-delay jobs on one thread, with
    # virtual threads on or off. So on one replica a prune run can delay the next
    # drain by up to its own length, and a slow drain can delay the prune. That is
    # acceptable here: a run is at most OutboxPruner.MAX_BATCHES_PER_RUN DELETEs of
    # prune-batch-size rows, each its own short transaction that skips locked rows
    # instead of waiting, and in steady state it is one short batch. A late prune
    # only keeps rows past the retention window a little longer.
    prune-interval: ${OUTBOX_PRUNE_INTERVAL:1h}
    # Rows per DELETE, so a backlog is pruned in small statements that neither lock
    # the poller out nor write a WAL burst.
    prune-batch-size: ${OUTBOX_PRUNE_BATCH_SIZE:1000}
  seed:
    enabled: true
  aws:
    region: ${AWS_REGION:ap-south-1}
    sqs-queue-url: ${SQS_QUEUE_URL:}

springdoc:
  # Every endpoint speaks JSON, so the document says application/json, not */*.
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  api-docs:
    # Public: it describes the endpoints, which still answer 401 without credentials.
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    # Separate from the document, for a deployment that wants the JSON without a page
    # that sends live requests.
    enabled: ${SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
    # Alphabetical, so the page does not reshuffle when a controller method moves.
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true

logging:
  # Every line carries [service,traceId,spanId,requestId]. Boot's own correlation
  # default is traceId and spanId only; the service name moves into this bracket and
  # include-application-name is off, so the name is printed once. requestId is the id
  # RequestIdFilter returns in X-Request-Id. Structured logging (prod) ignores the
  # pattern and writes each MDC key as its own field.
  include-application-name: false
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{requestId:-}] "
  level:
    com.smit.flightops: INFO
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
    # DEBUG names the filter and the missing authority behind a 401 or a 403.
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}

---
# postgres: real PostgreSQL on localhost, Flyway owns the schema.
#   docker run --name pg -e POSTGRES_PASSWORD=pass -e POSTGRES_DB=flightops \
#     -p 5432:5432 -d postgres:17-alpine
#   DB_PASSWORD=pass ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flightops}
    username: ${DB_USER:postgres}
    # No default, so no password is committed. Binding does not fail on an unset
    # DB_PASSWORD: Hikari gets the literal 14-character string "${DB_PASSWORD}", and
    # startup fails at Flyway's first connection with "password authentication
    # failed", which names the wrong cause. app.security names its property because
    # ApiSecurityProperties checks the {id} prefix in its constructor.
    password: ${DB_PASSWORD}
    hikari:
      # Bounds every row-lock wait. BookingWriter takes SELECT ... FOR UPDATE on the
      # flight row, so bookings for one flight queue by design. Unbounded, one
      # stalled holder blocks the queue, each waiter keeps one of ten pooled
      # connections, and reads fail too. 3s rather than NOWAIT, because contention
      # for the last seats is normal and clears in milliseconds.
      # connection-init-sql rather than a query hint, so it covers every lock the
      # service takes. PostgreSQL raises 55P03, which GlobalExceptionHandler answers
      # with 503 and Retry-After. See ADR 0002.
      connection-init-sql: SET lock_timeout = '3s'
  jpa:
    hibernate:
      # Flyway creates the schema; Hibernate fails fast if the entities drift from it.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
logging:
  level:
    # A placeholder, not a literal: a literal here would override the base
    # document's ${SQL_LOG_LEVEL:WARN} and make the SQL_LOG_LEVEL knob inert.
    org.hibernate.SQL: ${SQL_LOG_LEVEL:DEBUG}

---
# prod: everything from the environment, through
# deploy/k8s/base/configmap.yaml, the overlays under deploy/k8s/overlays/ and
# the Secret.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Repeated from postgres because profile documents do not inherit from each
      # other. Without it prod inherits the base document's H2 line,
      # SET LOCK_TIMEOUT 3000, which PostgreSQL rejects, and the pool never starts.
      connection-init-sql: SET lock_timeout = '3s'
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
app:
  security:
    # No defaults. A missing value stops startup naming the property, because the
    # literal ${API_PASSWORD} fails the {id} prefix check in ApiSecurityProperties.
    api-password: ${API_PASSWORD}
    ops-password: ${OPS_PASSWORD}
  events:
    publisher: ${APP_EVENTS_PUBLISHER:sqs}
  seed:
    enabled: false
logging:
  # One ECS JSON object per line: in a container stdout is the log transport, and
  # MDC keys become fields, so requestId is a term query. ECS suits OpenSearch.
  structured:
    format:
      console: ecs
