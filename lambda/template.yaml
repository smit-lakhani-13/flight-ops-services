AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  Async side of flight-ops-service. The Spring Boot service (meant to run
  separately on EKS) publishes a BookingCreated event to SQS; this Lambda
  consumes the queue and projects each event into a DynamoDB table of flight
  events. deploy/aws/up.sh deploys this stack, which can be deleted on its own.

# Deploy by hand with Maven, not `sam build`: SAM builds in a scratch copy of
# lambda/, where the tests cannot find ../contracts. --template-file names this
# file, so sam deploy never reads a .aws-sam/build left by an earlier
# `sam build`. From the repository root (SAM resolves CodeUri against this
# file's directory), in the region deploy/aws/lib.sh pins:
#   export AWS_REGION=ap-south-1 AWS_DEFAULT_REGION=ap-south-1
#   ./mvnw -B -f lambda/pom.xml clean package
#   sam deploy --template-file lambda/template.yaml --stack-name flight-ops-lambda \
#     --resolve-s3 --capabilities CAPABILITY_IAM
#   DDB_TABLE=flight-status-events sam local invoke BookingEventFunction \
#     -t lambda/template.yaml -e lambda/events/sqs.json
#   sam logs -n BookingEventFunction --stack-name flight-ops-lambda --tail
#
# sam local invoke resolves `!Ref FlightEventsTable` to the logical ID, so on
# its own it hands the handler DDB_TABLE=FlightEventsTable. A shell variable
# overrides a variable the template declares, which is what the DDB_TABLE=
# prefix does. Run the invoke after the deploy: before it no table exists, and
# the invoke shows only the parsing and both messages reported back as batch
# item failures.
#
# Tear down with `sam delete --stack-name flight-ops-lambda --region ap-south-1`
# or ./deploy/aws/down.sh. The shared bucket `--resolve-s3` creates is kept
# unless you pass --delete-sam-bucket.
#
# Everything here but the two alarms is pay-per-use and idles at about $0
# (doc/DEPLOYMENT.md section 5). The alarms bill per alarm-month whether or not
# they fire, after the ten standard alarms CloudWatch does not charge an
# account for. X-Ray stays inside its free tier at this volume: 100,000 traces
# recorded and 1,000,000 retrieved a month.

Globals:
  Function:
    # Must match maven.compiler.release in lambda/pom.xml. A runtime older
    # than it fails every invocation with UnsupportedClassVersionError. 21,
    # not java25: it is the main service's LTS, so one JDK builds both modules
    # and there is one JAVA_HOME to get right.
    Runtime: java21

    # arm64: about 20% cheaper per GB-second than x86_64. Safe because the jar
    # is pure bytecode (url-connection-client, not the native AWS CRT client;
    # see the <exclusions> in lambda/pom.xml). The Docker image is different:
    # it ships an OS and must be built for the nodes' amd64.
    Architectures:
      - arm64

    # CPU scales with memory. For a JVM, 1024 MB can cost less than 512 MB,
    # because halving the duration cancels doubling the rate.
    MemorySize: 1024

    # A sixth of the queue's VisibilityTimeout; see BookingEventQueue.
    Timeout: 30

    Tracing: Active

    Environment:
      Variables:
        # BookingEventHandler throws at init if this is missing, instead of
        # failing each message with an opaque SDK validation error.
        DDB_TABLE: !Ref FlightEventsTable

    Tags:
      Project: flight-ops

Resources:

  BookingEventQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: booking-events

      # The SQS-owned key: free, with no key policy of your own. Data under a
      # rule that names KMS would need a customer key; booking ids do not.
      SqsManagedSseEnabled: true

      # AWS advises 6x the function Timeout; this is 6 x 30s. If visibility
      # expires mid-batch, SQS hands the same message to a second invocation.
      VisibilityTimeout: 180

      RedrivePolicy:
        deadLetterTargetArn: !GetAtt BookingEventDLQ.Arn
        # AWS advises at least 5 for a queue Lambda reads, to give Lambda a few
        # retries before the DLQ. 3 on purpose: each extra try at a poison
        # message is a paid invocation that cannot succeed. The cost: if the
        # account pool runs dry, three throttles are enough to dead-letter a
        # message. The backlog alarm's 600 s threshold sits just above
        # 3 x 180 s, so change the two together.
        maxReceiveCount: 3

      Tags:
        - Key: Project
          Value: flight-ops

  BookingEventDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: booking-events-dlq

      SqsManagedSseEnabled: true

      # 14 days, the SQS maximum: a Friday-night failure is still there on
      # Monday week.
      MessageRetentionPeriod: 1209600
      Tags:
        - Key: Project
          Value: flight-ops

  # No AlarmActions on either alarm, on purpose. An action is an ARN, in
  # practice an SNS topic, and neither this stack nor
  # deploy/aws/foundation.yaml has one. Wiring one means a topic here with an
  # e-mail subscription, a new parameter for the address (foundation.yaml's
  # AlertEmail belongs to another stack), and someone clicking the confirmation
  # link SNS sends before anything is delivered. Until then an alarm changes
  # state in the console and tells no one. CI lints this template and never
  # deploys it.
  #
  # Any message on the dead-letter queue was received three times without
  # success. Usually the Lambda failed on it three times; a dry account pool
  # can also throttle one there.
  BookingEventDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: booking-events-dlq-not-empty
      AlarmDescription: A booking event is on the dead-letter queue after three receives without success, usually three Lambda failures.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt BookingEventDLQ.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      # An idle queue publishes no metrics, which is this queue's normal state.
      TreatMissingData: notBreaching
      Tags:
        - Key: Project
          Value: flight-ops

  # A message that keeps failing is received three times, 180 s of visibility
  # each, and leaves for the dead-letter queue within about 540 s. So an oldest
  # message older than 600 s has not been retried out; it is waiting, and the
  # Lambda is behind, throttled or not polling.
  BookingEventBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: booking-events-backlog
      AlarmDescription: The oldest booking event has waited more than ten minutes for the Lambda, for five minutes in a row.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt BookingEventQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 5
      Threshold: 600
      ComparisonOperator: GreaterThanThreshold
      # Reported only while the queue holds a message, so an empty queue is
      # missing data, and healthy.
      TreatMissingData: notBreaching
      Tags:
        - Key: Project
          Value: flight-ops

  FlightEventsTable:
    # Not AWS::Serverless::SimpleTable, which has no sort key.
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: flight-status-events

      # On-demand: $0 when idle and no throttling under a burst. Provisioned
      # wins above very roughly a 30% duty cycle.
      BillingMode: PAY_PER_REQUEST

      # Key attributes only; the other item fields need no declaration.
      AttributeDefinitions:
        - AttributeName: flightNumber
          AttributeType: S
        - AttributeName: eventTime
          AttributeType: S

      KeySchema:
        # Every query is "what happened to flight X", inside one partition.
        - AttributeName: flightNumber
          KeyType: HASH

        # <fixed-width ISO-8601 timestamp>#<bookingId>. The bookingId keeps two
        # bookings in the same instant apart, and the key is the same on every
        # redelivery, so the conditional write is an idempotency check.
        # BookingEventHandler#sortKey has the reasoning;
        # lambda/events/sqs-same-instant.json exercises it.
        - AttributeName: eventTime
          KeyType: RANGE

      # Off: not in the free tier, and this is regenerable demo data.
      # PointInTimeRecoverySpecification:
      #   PointInTimeRecoveryEnabled: true

      Tags:
        - Key: Project
          Value: flight-ops

  # Declared, so the stack owns it and deletes it. Left to itself, Lambda makes
  # one that never expires and that no stack removes.
  BookingEventFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/booking-event-handler
      # A week is enough; the DLQ is the durable record of a failure.
      RetentionInDays: 7
      Tags:
        - Key: Project
          Value: flight-ops

  BookingEventFunction:
    Type: AWS::Serverless::Function
    # Otherwise Lambda can create the group first, and the stack then fails.
    DependsOn: BookingEventFunctionLogGroup
    Properties:
      # The shaded jar, deployed as built; CI checks it holds the Handler.
      CodeUri: target/booking-event-handler.jar

      Handler: com.smit.flightops.lambda.BookingEventHandler::handleRequest

      Description: Projects BookingCreated events from SQS into DynamoDB

      # Fixed, so the log group above can name it. Two copies of this stack
      # cannot share a region.
      FunctionName: booking-event-handler

      # PutItem, UpdateItem and BatchWriteItem on this table and its indexes;
      # the handler only calls PutItem. The SQS event adds
      # AWSLambdaSQSQueueExecutionRole, whose SQS actions are on Resource "*".
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref FlightEventsTable

      Events:
        BookingEvents:
          Type: SQS
          Properties:
            Queue: !GetAtt BookingEventQueue.Arn

            BatchSize: 10

            # Caps a backlog at five invocations. Unlike reserved concurrency,
            # it takes nothing from the account pool, so it deploys on a small
            # quota. Messages over the cap wait in the queue instead of being
            # throttled back with a raised receive count and sent to the DLQ.
            # The value must be 2 to 1000. It limits only the poller, so an
            # account pool that runs dry can still throttle.
            ScalingConfig:
              MaximumConcurrency: 5

            # Only the ids in the returned SQSBatchResponse go back to the
            # queue. A null response or an empty list counts as complete
            # success and deletes the whole batch, so every exit path must
            # return the failures it found, unparseable JSON included. An
            # invalid response or an unknown itemIdentifier fails the batch.
            FunctionResponseTypes:
              - ReportBatchItemFailures

  # No SnapStart. Commonly reported figures (not measured here) put a restore
  # at a few hundred ms against 1-2s for a plain SDK handler. It needs a
  # published version and an alias, state cached at init is stale on restore,
  # and no one waits on this asynchronous consumer's cold start.

Outputs:
  QueueUrl:
    Description: Set as SQS_QUEUE_URL on the Spring Boot service (with app.events.publisher=sqs)
    Value: !Ref BookingEventQueue

  QueueArn:
    Description: Queue ARN, for an IAM policy granting the service sqs:SendMessage
    Value: !GetAtt BookingEventQueue.Arn

  DlqUrl:
    Description: Poll this after a failure test - aws sqs receive-message --queue-url <this>
    Value: !Ref BookingEventDLQ

  TableName:
    Description: aws dynamodb query --table-name <this> --key-condition-expression 'flightNumber = :f' ...
    Value: !Ref FlightEventsTable

  DlqAlarmName:
    Description: Alarm on any message in the DLQ. No notification target - aws cloudwatch describe-alarms --alarm-names <this>
    Value: !Ref BookingEventDLQAlarm

  BacklogAlarmName:
    Description: Alarm on the oldest queued message staying above 600 s for five minutes. No notification target - aws cloudwatch describe-alarms --alarm-names <this>
    Value: !Ref BookingEventBacklogAlarm

  FunctionName:
    Description: Physical function name. For logs - sam logs -n BookingEventFunction --stack-name <stack> --tail (the logical ID, not this value)
    Value: !Ref BookingEventFunction
