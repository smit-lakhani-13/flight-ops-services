# TEMPLATE ONLY — copy it, do not edit it in place:
#   cp k8s/secret.example.yaml k8s/secret.yaml
#   # put the real password in k8s/secret.yaml
#   kubectl apply -f k8s/secret.yaml
#
# k8s/secret.yaml is in .gitignore. This example file is the only one committed,
# and it contains a placeholder. That is the whole point: a password in Git
# history is a password you have to rotate, and `git rm` does not remove it.
#
# (Both files declare the same metadata.name, and "secret.example.yaml" sorts
# before "secret.yaml", so `kubectl apply -f k8s/` applies the placeholder and
# then immediately overwrites it with the real value. Applying the directory is
# still safe — but apply the real file explicitly if you want to be sure.)
#
# ------------------------------------------------------------------------------
# THE LIMITATION THIS FILE DOES NOT SOLVE:
# a Kubernetes Secret is base64-ENCODED, not encrypted. Anyone with `get secret`
# in this namespace reads it with one command:
#   kubectl get secret flight-ops-secret -n flight-ops -o jsonpath='{.data.DB_PASSWORD}' | base64 -d
# By default it is also stored in etcd in plaintext.
#
# What production actually does:
#   1. AWS Secrets Manager or SSM Parameter Store + the Secrets Store CSI driver,
#      so the value is mounted at runtime and never becomes a k8s object.
#   2. IRSA for AWS access, so there is no AWS key to store at all — which is
#      what this project does for SQS and DynamoDB. The DB password is the only
#      thing left, and RDS IAM auth would remove that too.
#   3. Envelope encryption of etcd with a KMS key (EKS: --encryption-config).
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: flight-ops-secret
  namespace: flight-ops
type: Opaque
# stringData takes plaintext and base64-encodes it on the way in. `data` would
# require you to encode by hand — one more step, one more chance to paste a
# trailing newline from `echo` instead of `printf` and get a 28401 auth failure.
stringData:
  DB_PASSWORD: "REPLACE_ME"

  # The two API identities. These are ENCODED passwords, not plaintext - each
  # carries the algorithm id the DelegatingPasswordEncoder dispatches on, so a
  # leaked Secret does not hand anyone a working credential. Generate with:
  #
  #   htpasswd -bnBC 10 "" "your-password" | tr -d ':\n'
  #
  # and paste the result after {bcrypt}. Leaving either key out does NOT leave
  # the service unauthenticated and does NOT leave it running on a default: the
  # prod profile supplies no default, and ApiSecurityProperties rejects an
  # unresolved placeholder, so the pod fails to start and names the property.
  # That is deliberate - see the comment on that record for what used to happen
  # instead, which was very much worse than a failed rollout.
  API_PASSWORD: "{bcrypt}REPLACE_ME"
  OPS_PASSWORD: "{bcrypt}REPLACE_ME"
