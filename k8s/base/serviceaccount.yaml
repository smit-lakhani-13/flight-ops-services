# The identity the pods run as, and the thing IRSA attaches an IAM role to.
#
# The Deployment already says `serviceAccountName: flight-ops-sa`. Without this
# file that is a dangling reference: the pods stay Pending with
# "error looking up service account flight-ops/flight-ops-sa", which is a
# five-minute debugging session for a missing eight-line manifest.
#
# The IAM role annotation is NOT here. It names an account id, so it belongs to
# the overlay that knows which account this is deployed into --
# k8s/overlays/aws/serviceaccount-irsa.yaml. Kept out of the base so the base
# can be applied to any cluster, including one with no AWS at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flight-ops-sa
  labels:
    app: flight-ops
# automountServiceAccountToken is left unset, which means true.
#
# The instinct is to turn it off: the application never calls the Kubernetes
# API, so the token is attack surface for nothing. But IRSA works by having the
# AWS SDK read a PROJECTED service account token from
# AWS_WEB_IDENTITY_TOKEN_FILE, and setting this to false removes the projected
# volume the mutating webhook adds. The pod then starts, looks healthy, and
# every SQS call fails with "Unable to load credentials" at the first booking.
# Turning it off is correct only once the AWS calls are gone.
