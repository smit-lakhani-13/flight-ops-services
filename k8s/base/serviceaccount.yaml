# The identity the pods run as, and what IRSA attaches an IAM role to. The
# role-arn annotation names an account id, so it is added by
# k8s/overlays/aws/serviceaccount-irsa.yaml and the base stays AWS-free.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flight-ops-sa
  labels:
    app: flight-ops
# automountServiceAccountToken is left unset, meaning true. The app never calls
# the Kubernetes API, but IRSA has the SDK read a projected token from
# AWS_WEB_IDENTITY_TOKEN_FILE, and false removes the volume the webhook adds.
# The pod would look healthy and fail every SQS call with "Unable to load
# credentials".
