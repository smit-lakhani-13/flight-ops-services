# The identity the pods run as, and what IRSA attaches an IAM role to. The
# role-arn annotation names an account id, so it is added by
# k8s/overlays/aws/serviceaccount-irsa.yaml and the base stays AWS-free.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flight-ops-sa
  labels:
    app: flight-ops
# automountServiceAccountToken is left unset, meaning true, although the app
# never calls the Kubernetes API. Setting it to false would drop only the
# Kubernetes API token. IRSA does not depend on it: the EKS pod identity
# webhook adds its own projected token volume, aws-iam-token, and points
# AWS_WEB_IDENTITY_TOKEN_FILE at it.
