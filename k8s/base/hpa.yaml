# Horizontal Pod Autoscaler: add pods, not bigger pods.
#
# REQUIRES metrics-server. On a fresh EKS cluster it is NOT installed, and
# without it the HPA reports `<unknown>/70%` and never scales. deploy/aws/up.sh
# installs it as an EKS managed addon, so there is no pinned upstream URL here
# to go stale.
#
# It also requires resource *requests* on the container — the target is a
# percentage OF THE REQUEST, not of the node. 70% here means 175m of the 250m
# request, so scaling starts well before the 1000m limit throttles anything.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flight-ops-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flight-ops
  minReplicas: 2
  # 4, and the limit is the database, not the cluster.
  #
  # Each pod opens a Hikari pool of up to 10 connections. db.t4g.micro derives
  # max_connections from DBInstanceClassMemory/9531392, which on its 1 GiB comes
  # to about 112, of which a few are reserved for superuser sessions. Four pods
  # is 40 connections at full stretch — room for a migration, a psql session and
  # a second deployment's pods running alongside during a rolling update.
  #
  # Ten pods would be 100. That fits, arithmetically, and leaves nothing: the
  # next `kubectl exec ... psql` fails with "remaining connection slots are
  # reserved", which reads like a database fault and is a replica-count fault.
  # Raising this means raising the instance class or lowering the pool, in that
  # order.
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # A second metric is worth knowing about: with two metrics the HPA computes
    # a desired count for each and takes the MAX. Memory is a poor scaling
    # signal for a JVM though — the heap grows to MaxRAMPercentage and stays
    # there, so memory utilisation is high and flat regardless of load, and a
    # memory-target HPA would scale out once and never scale back in.
    # RPS or queue depth via KEDA/Prometheus adapter is the real answer.
  behavior:
    scaleUp:
      # React fast to load.
      stabilizationWindowSeconds: 0
    scaleDown:
      # Five minutes of sustained low CPU before removing a pod. Without this,
      # a bursty workload flaps: scale up, scale down, scale up. Every scale-down
      # drops connections and every scale-up pays JVM warm-up again, so the
      # asymmetry (instant up, slow down) is intentional.
      stabilizationWindowSeconds: 300
