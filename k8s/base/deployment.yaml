apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-ops
  labels:
    app: flight-ops
spec:
  # No `replicas`: the HPA owns the count (minReplicas: 2, so a rolling update
  # or a node drain is never an outage). A declared count would be reset by
  # every `kubectl apply`, and CI applies the whole overlay on every push.

  # Keeps `kubectl get rs` readable.
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: flight-ops
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      # A new pod must pass readiness before an old one goes, so capacity never
      # dips during a deploy.
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: flight-ops
    spec:
      # IRSA: the pod gets short-lived STS credentials from a projected OIDC
      # token, and DefaultCredentialsProvider in AwsConfig finds them. No access
      # key exists anywhere. Three pieces, none of them this file:
      #   1. the policy: flight-ops-service-sqs-publish in deploy/aws/foundation.yaml,
      #      one action (sqs:SendMessage) on one queue ARN;
      #   2. the role and its trust: flight-ops-sqs-publisher, from up.sh step 7
      #      (`eksctl create iamserviceaccount --role-only`, so eksctl does not
      #      also claim the ServiceAccount);
      #   3. the ServiceAccount: k8s/base/serviceaccount.yaml, with the role-arn
      #      annotation from k8s/overlays/aws/serviceaccount-irsa.yaml.
      # A name that disagrees with serviceaccount.yaml leaves the pods Pending
      # with `error looking up service account flight-ops/flight-ops-sa`.
      serviceAccountName: flight-ops-sa

      securityContext:
        # The kubelet checks the numeric UID from the image, which is why the
        # Dockerfile says `USER 1001:1001`, not a user name.
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault

      # A PDB does nothing about a node dying, so the replicas prefer separate
      # nodes. `preferred`, so a single-node cluster still schedules both.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: flight-ops

      # 5s preStop + 30s spring.lifecycle.timeout-per-shutdown-phase = 35s < 45s,
      # so the kubelet never SIGKILLs mid-request.
      terminationGracePeriodSeconds: 45

      containers:
        - name: flight-ops
          # A version, never `:latest`. The overlay's `images` transformer
          # points it at ECR with the commit SHA as the tag.
          image: flight-ops-service:1.1.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # Every ConfigMap and Secret key as an environment variable. Relaxed
          # binding maps SPRING_PROFILES_ACTIVE to spring.profiles.active; the
          # rest (DB_PASSWORD, SQS_QUEUE_URL, ...) are read by name through the
          # ${...} placeholders in application.yml.
          envFrom:
            - configMapRef:
                name: flight-ops-config
            - secretRef:
                name: flight-ops-secret

          securityContext:
            allowPrivilegeEscalation: false
            # With an emptyDir at /tmp for Tomcat's work directory and the JVM's
            # hsperfdata. Code execution in the container cannot drop a binary
            # or overwrite the jar, and a dependency that writes elsewhere fails
            # with EROFS in the logs.
            readOnlyRootFilesystem: true
            capabilities:
              # It binds a port above 1024 and does nothing else privileged.
              drop: ["ALL"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          resources:
            # Over the CPU limit a container is throttled; over the memory limit
            # it is OOMKilled. -XX:MaxRAMPercentage=75.0 in the Dockerfile sizes
            # the heap from the limit. Worst case for the 768Mi:
            #   576Mi  heap
            #    64Mi  the /tmp tmpfs, charged to this container if filled
            #   128Mi  metaspace, thread stacks, code cache, direct buffers, GC
            # The last line is tight. Raise the limit with the tmpfs sizeLimit
            # or with a dependency that allocates direct buffers. To check:
            #   kubectl exec -n flight-ops deploy/flight-ops -- \
            #     jcmd 1 VM.native_memory summary
            requests:
              # Equal to the limit, for Guaranteed QoS. Burstable pods are
              # evicted first under node pressure.
              memory: "768Mi"
              cpu: "500m"
            limits:
              memory: "768Mi"
              # No CPU limit. CFS throttling hits a JVM hardest during class
              # loading and GC, inside the startup probe's window, and it would
              # make the HPA measure the throttle instead of the load.

          # Readiness decides whether traffic comes here. Spring flips it to
          # OUT_OF_SERVICE when SIGTERM arrives.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          # Liveness restarts a wedged process, so it is slower than readiness,
          # and Spring's liveness group leaves out the database: an RDS failover
          # must not restart every pod.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # Up to 30 x 10s = 300s for JVM, Spring and Flyway to start, during
          # which readiness and liveness are suspended. It ends as soon as the
          # app is up, unlike a long initialDelaySeconds.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30

          lifecycle:
            # SIGTERM and the removal from the ALB target group race. preStop
            # runs first, so 5s of sleep lets the target deregister before the
            # JVM starts shutting down, instead of a 502 on every deploy.
            preStop:
              exec:
                command: ["sleep", "5"]

      volumes:
        # emptyDir, so nothing written survives the pod or is shared with the
        # node. medium: Memory is tmpfs, which counts against the memory limit;
        # hence the sizeLimit.
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
