# Non-secret configuration, as environment variables through `envFrom` in the
# Deployment. Relaxed binding maps SPRING_PROFILES_ACTIVE to
# spring.profiles.active; the rest (AWS_REGION, DB_URL, SQS_QUEUE_URL, ...) are
# read by name through ${...} placeholders in application.yml. The image is
# built once, and what differs per cluster lives here.
#
# A change here does not restart pods. Spring reads the environment once, so
# follow an edit with
#   kubectl rollout restart deployment/flight-ops -n flight-ops
apiVersion: v1
kind: ConfigMap
metadata:
  name: flight-ops-config
data:
  # The `prod` profile: Flyway on, ddl-auto=validate, seeder off, health
  # details hidden.
  SPRING_PROFILES_ACTIVE: "prod"

  # Must match cluster.yaml and the workflow's AWS_REGION. A mismatch shows up
  # as an IRSA auth error or an ECR image-pull error.
  AWS_REGION: "ap-south-1"


  # Quoted: ConfigMap values must be strings, and a bare 8080 is an integer.
  SERVER_PORT: "8080"

  # The prod profile defaults to sqs already; set here so the running config is
  # greppable in one place.
  APP_EVENTS_PUBLISHER: "sqs"

  # The aws overlay fills this in. Empty here, SqsEventPublisher stops the pod
  # at startup when the publisher is sqs.
  SQS_QUEUE_URL: ""

  DB_URL: "jdbc:postgresql://flight-ops-db.example.rds.amazonaws.com:5432/flightops"
  DB_USER: "flightops"
