# ClusterIP: reachable only inside the cluster, with no load balancer and
# nothing billed. The opt-in Ingress in k8s/components/ingress exposes it.
# In the cluster: http://flight-ops.flight-ops.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: flight-ops
  labels:
    app: flight-ops
spec:
  type: ClusterIP
  # Matches pod labels. A typo gives zero endpoints and no error; check with
  #   kubectl get endpoints flight-ops -n flight-ops
  selector:
    app: flight-ops
  ports:
    - name: http
      protocol: TCP
      port: 80          # the port the Service listens on
      targetPort: http  # the named containerPort on the pod (8080)
