# The EKS overlay: what the base leaves out.
#
# Four values here are ${NAME} placeholders. Kustomize has no variable
# substitution and passes them through as written; envsubst in
# deploy/aws/render-aws.sh, the one render path, fills them in:
#
#   AWS_ACCOUNT_ID  the ECR registry the image comes from, and the account the
#                   IRSA role lives in
#   IMAGE_TAG       the commit SHA CI built, never `latest`, so that
#                   `kubectl rollout undo` returns to a known image
#   SQS_QUEUE_URL   the queue the outbox publishes to
#   DB_URL          the RDS endpoint, unknown until the data stack creates it
#
# render-aws.sh fails if any of them is unset. A missing value is then a render
# error, not a pod that starts with SQS_QUEUE_URL="" and crash-loops at
# startup.
#
# Render it with:
#   AWS_ACCOUNT_ID=... IMAGE_TAG=... SQS_QUEUE_URL=... DB_URL=... \
#     deploy/aws/render-aws.sh
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flight-ops

resources:
  - ../../base

# The Ingress is opt-in because it provisions a billed ALB. Uncomment to add
# it, or apply it separately once the AWS Load Balancer Controller is running:
# components:
#   - ../../components/ingress

images:
  - name: flight-ops-service
    newName: ${AWS_ACCOUNT_ID}.dkr.ecr.ap-south-1.amazonaws.com/flight-ops-service
    newTag: ${IMAGE_TAG}

patches:
  - path: serviceaccount-irsa.yaml
  - path: configmap-aws.yaml
