# IRSA: the pods' AWS identity.
#
# On the Kubernetes side the annotation is all it takes. The EKS pod identity
# webhook injects AWS_ROLE_ARN and AWS_WEB_IDENTITY_TOKEN_FILE into every
# container and projects a signed token at that path. The SDK's default
# credential chain uses them to call AssumeRoleWithWebIdentity, so no access key
# exists in the cluster.
#
# up.sh creates the role with a trust policy pinned to this namespace and
# service account, so a pod elsewhere cannot assume it by copying the
# annotation.
#
# Nothing fails until the first SQS call, so check the first rollout with
#   kubectl exec deploy/flight-ops -n flight-ops -- env | grep AWS_WEB_IDENTITY
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flight-ops-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::${AWS_ACCOUNT_ID}:role/flight-ops-sqs-publisher
