# IRSA: the pods' AWS identity.
#
# The annotation is all there is to it on the Kubernetes side. The EKS pod
# identity webhook sees it, injects AWS_ROLE_ARN and AWS_WEB_IDENTITY_TOKEN_FILE
# into every container, and projects a signed service account token at that
# path. The AWS SDK's default credential chain picks those up and calls
# AssumeRoleWithWebIdentity. No access key exists anywhere in the cluster.
#
# The role itself is created by deploy/aws/up.sh with a trust policy pinned to
# this exact namespace and service account name, so a pod in another namespace
# cannot assume it by copying the annotation.
#
# First-rollout check, because this fails silently until the first SQS call:
#   kubectl exec deploy/flight-ops -n flight-ops -- env | grep AWS_WEB_IDENTITY
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flight-ops-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::${AWS_ACCOUNT_ID}:role/flight-ops-sqs-publisher
