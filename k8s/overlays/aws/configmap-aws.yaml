# The two values that exist only once AWS does: SQS_QUEUE_URL is an output of
# the SAM stack, DB_URL of the data stack. Neither is a secret. Publishing to
# the queue needs the IRSA role, and the JDBC URL carries no password; that
# comes from the Secret as DB_PASSWORD.
apiVersion: v1
kind: ConfigMap
metadata:
  name: flight-ops-config
data:
  SQS_QUEUE_URL: "${SQS_QUEUE_URL}"
  DB_URL: "${DB_URL}"
