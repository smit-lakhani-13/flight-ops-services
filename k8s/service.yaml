# ClusterIP: reachable only inside the cluster. No load balancer, no public IP,
# nothing billable. The Ingress (k8s/optional/ingress.yaml) is what exposes this
# to the internet, and it is deliberately kept out of this directory.
#
# A Service is a stable name plus a load-balanced virtual IP in front of a set of
# pods. Pods are mortal and their IPs change on every restart; `flight-ops` does
# not. Inside the cluster, http://flight-ops.flight-ops.svc.cluster.local resolves
# here (<service>.<namespace>.svc.cluster.local).
apiVersion: v1
kind: Service
metadata:
  name: flight-ops
  namespace: flight-ops
  labels:
    app: flight-ops
spec:
  type: ClusterIP
  # The selector is the ONLY link between a Service and its pods — it matches
  # pod labels, not the Deployment. A typo here produces a Service with zero
  # endpoints: DNS resolves, connections are refused, and nothing reports an
  # error. First thing to check when traffic vanishes:
  #   kubectl get endpoints flight-ops -n flight-ops
  selector:
    app: flight-ops
  ports:
    - name: http
      protocol: TCP
      port: 80          # the port the Service listens on
      targetPort: http  # the named containerPort on the pod (8080)
      # Naming the target rather than hardcoding 8080 means the container port
      # can move without touching this file.
