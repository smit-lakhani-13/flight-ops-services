# An optional component that no overlay includes by default. The Ingress it
# adds creates a billed ALB (DEPLOYMENT.md section 5) that outlives the pods,
# so it is opted into, not part of the base. down.sh checks for an orphaned load
# balancer before it reports success.
#
# Add it to an overlay with:
#   components:
#     - ../../components/ingress
#
# up.sh applies ingress.yaml with -f instead, because kustomize cannot build a
# Component on its own. A label or patch added here does not reach that apply.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - ingress.yaml
