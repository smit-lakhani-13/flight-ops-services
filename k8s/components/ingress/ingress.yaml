# THIS FILE COSTS MONEY, which is why it is a kustomize component.
#
# No overlay here lists it under `components:`; k8s/overlays/aws has the line
# commented out. up.sh step 11 applies it on its own with -f, so no deploy
# creates a public endpoint by accident.
#
# Applying it has the AWS Load Balancer Controller create an Application Load
# Balancer, which bills from creation until it is deleted (doc/DEPLOYMENT.md
# section 5). Deleting a Deployment does not delete an ALB.
#
# Teardown order matters. down.sh step 1 deletes this Ingress and waits for the
# ALB to go before it touches the controller or the cluster. By hand:
#     kubectl delete ingress flight-ops-ingress -n flight-ops   # first
#     aws elbv2 describe-load-balancers --region ap-south-1 \
#       --query 'LoadBalancers[].LoadBalancerName'              # confirm gone
#     aws cloudformation delete-stack --stack-name flight-ops-data --region ap-south-1
#     aws cloudformation wait stack-delete-complete \
#       --stack-name flight-ops-data --region ap-south-1        # the database next
#     eksctl delete cluster -f deploy/aws/cluster.yaml          # only then
#
# Delete the cluster first and the controller that owns the ALB goes with it.
# The load balancer is orphaned: still billing, invisible to kubectl, and
# findable only in the EC2 console. The database goes before the cluster too:
# its security group sits in eksctl's VPC and blocks the VPC delete.
# deploy/aws/down.sh does all of this, and the other stacks, in order.
#
# Without this file the app is testable through a port-forward, for $0:
#     kubectl port-forward -n flight-ops svc/flight-ops 8080:80
#     curl localhost:8080/actuator/health
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flight-ops-ingress
  annotations:
    # An Ingress does nothing without a controller, and EKS does not install
    # one; up.sh step 8 installs the AWS Load Balancer Controller with Helm.
    # Without it this applies cleanly and `kubectl get ingress` shows an empty
    # ADDRESS for ever.
    alb.ingress.kubernetes.io/scheme: internet-facing

    # Pod IPs go straight into the target group, so traffic runs ALB -> pod.
    # `instance` would target the NodePort, adding a kube-proxy hop that loses
    # the client IP and the per-pod health check. Needs the VPC CNI, which EKS
    # has.
    alb.ingress.kubernetes.io/target-type: ip

    # The ALB checks health on its own, apart from the kubelet. Readiness
    # answers its question: should traffic go here?
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"

    # Under terminationGracePeriodSeconds (45s), or the ALB still drains a
    # target the kubelet has killed. With the 5s preStop hook, this keeps a
    # rolling update from dropping requests.
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30

    # Here, not in the component's kustomization.yaml, because up.sh applies
    # this file with -f. down.sh's sweep finds the ALB by this tag.
    alb.ingress.kubernetes.io/tags: Project=flight-ops

    # Production would add an ACM certificate-arn, listen-ports for 443,
    # ssl-redirect and WAF. A certificate needs a domain, and this lab has none.
spec:
  # ingressClassName replaces the deprecated kubernetes.io/ingress.class annotation.
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flight-ops
                # The Service port (80), not the container port (8080).
                port:
                  number: 80
