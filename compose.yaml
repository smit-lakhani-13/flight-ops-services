# The whole service on a laptop: PostgreSQL, the application, one command.
#
#   docker compose up --build          # http://localhost:8080
#   ./demo.sh                          # the eight acts, against the container
#   docker compose down -v             # -v also drops the database volume
#
# Not the deployment (DEPLOYMENT.md). It adds what the H2 default profile
# lacks: Flyway migrations, and PostgreSQL's own row locks and `lock_timeout`.
# There is no queue. With `APP_EVENTS_PUBLISHER=log`, outbox rows go through
# every step but the `SendMessage` call, so no LocalStack image is needed.

services:
  db:
    # 17, matching the RDS engine version in deploy/aws/data.yaml, so a
    # migration that works here works there. Keep the two in step.
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flightops
      POSTGRES_USER: postgres
      # Local only, and unpublished outside the compose network unless the
      # mapping below is uncommented. Nothing here is a real secret.
      POSTGRES_PASSWORD: pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Uncomment to reach the database from the host with psql. Off by default,
    # because 5432 is often taken on a laptop.
    # ports:
    #   - "5432:5432"
    healthcheck:
      # With -U and -d. On a first start, a bare `pg_isready` passes before the
      # init scripts create the database, and Flyway fails in a way a second
      # run does not reproduce.
      test: ["CMD-SHELL", "pg_isready -U postgres -d flightops"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      args:
        # Stamped into org.opencontainers.image.revision, where CI passes the
        # commit. `local` means a working tree; the Dockerfile's default,
        # `unknown`, means no --build-arg at all.
        GIT_SHA: local
    depends_on:
      db:
        # Not `depends_on: [db]`, which waits only for the container to be
        # created, so the app would exit before PostgreSQL finished initialising.
        condition: service_healthy
    environment:
      # The image defaults to prod, which expects RDS, IRSA and the SQS
      # publisher. This selects the postgres profile: the local database, with
      # Flyway and the log publisher.
      SPRING_PROFILES_ACTIVE: postgres

      # `db` is the compose service name, resolved by compose's own DNS.
      DB_URL: jdbc:postgresql://db:5432/flightops
      DB_USER: postgres
      DB_PASSWORD: pass

      # log or sqs; any other value stops startup. `log` drains the outbox and
      # sends nothing to AWS. `sqs` without SQS_QUEUE_URL also stops startup.
      APP_EVENTS_PUBLISHER: log

      # Bcrypt of "dev-secret" and "dev-ops", demo.sh's defaults. Hashed, not
      # {noop}, so the local stack takes the same PasswordEncoder path as the
      # cluster. `$$` is compose's escape for a literal `$`.
      API_PASSWORD: "{bcrypt}$$2y$$10$$AebmD7.ds0witGfY6P.qC.K42KNLCYfOlzD4QPQ5Qo4Kp2wUA.NIW"
      OPS_PASSWORD: "{bcrypt}$$2y$$10$$ekIVCvlYn8UNZ2KYa2J/4.C4/StCIwfKJuVEJNcnAqQEzmYqUkjdq"

      # Chattier than the prod profile, which leaves org.hibernate.SQL at WARN.
      SQL_LOG_LEVEL: DEBUG
    ports:
      - "8080:8080"
    healthcheck:
      # Readiness, the check the Kubernetes readiness probe uses. It turns UP
      # only when startup, the demo seeder included, has finished and the
      # database answers. During Flyway nothing answers: the port opens after.
      # wget, because the Alpine runtime image has BusyBox wget and no curl.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

volumes:
  pgdata:
