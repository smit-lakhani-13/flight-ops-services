# eksctl cluster definition. deploy/aws/up.sh creates it at step 4, then adds
# what this file cannot express: the STANDARD upgrade policy, CI's
# namespace-scoped access entry and the VPC lookup for the database.
# deploy/aws/down.sh deletes it. It bills from creation (doc/DEPLOYMENT.md).
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: flight-ops-cluster

  # One region for everything (adr/0010-region-ap-south-1.md). The ConfigMap,
  # the overlay's ECR host, the workflow and deploy/aws/lib.sh must agree:
  #   git grep -n 'ap-south-1' -- .github deploy
  region: ap-south-1

  # Pinned as a cost control: past standard support, the control plane bills
  # six times the rate. On 22 Sep 2026 standard support covered 1.36 (ends
  # 2027-08-02), 1.35 and 1.34. Re-check before creating:
  #   aws eks describe-cluster-versions --region ap-south-1 \
  #     --query 'clusterVersions[?versionStatus==`STANDARD_SUPPORT`].[clusterVersion,endOfStandardSupportDate]' \
  #     --output table
  version: "1.36"

  tags:
    # On every resource eksctl creates; down.sh's sweep searches for it.
    Project: flight-ops
    Owner: smit
    Environment: lab

# API_AND_CONFIG_MAP, for the access entry up.sh creates. A malformed aws-auth
# ConfigMap edit can lock everyone out; an access entry is validated.
accessConfig:
  authenticationMode: API_AND_CONFIG_MAP
  # The identity that runs `eksctl create cluster` gets cluster-admin.
  bootstrapClusterCreatorAdminPermissions: true

vpc:
  nat:
    # Single, stated explicitly although it is eksctl's default. An AZ failure
    # then cuts egress (SQS, ECR) for the other AZs' nodes. Fine for a demo.
    gateway: Single

iam:
  # The cluster OIDC provider that IRSA needs.
  withOIDC: true

managedNodeGroups:
  - name: ng-1
    # The floor: the pod requests 768Mi/500m, the system agents take about
    # 0.5-0.7 GiB a node, and the VPC CNI allows 17 pods on a t3.medium.
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 4
    volumeSize: 20

    # Private IPs only; inbound traffic comes through the ALB. This decides
    # node placement, not the NAT gateway: dropping NAT takes this set to false
    # and `vpc.nat.gateway: Disable`. doc/DEPLOYMENT.md prices that variant.
    privateNetworking: true

    iam:
      withAddonPolicies:
        # Node agents only; application logs are not shipped.
        cloudWatch: true
        # No albIngress or autoScaler: both put a policy on the node role, which
        # every pod on the node can use. The LB controller has its own IRSA role.

    labels:
      role: worker
    tags:
      Project: flight-ops

# Off, because CloudWatch bills on ingest. The `authenticator` log explains
# "kubectl says Unauthorized"; uncomment before debugging an access entry.
# cloudWatch:
#   clusterLogging:
#     enableTypes: ["audit", "authenticator"]
#     logRetentionInDays: 1
