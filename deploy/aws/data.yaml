AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  flight-ops data: one PostgreSQL instance inside the cluster's VPC.

  This template is demo-shaped, not production-shaped, and says so rather than
  implying otherwise: Single-AZ, no backups, no read replica, no Performance
  Insights, deletion policy Delete. Every one of those is the wrong default for
  a system with users, and the right default for a stack that exists for a week
  and must leave nothing behind. The production shape is written out in
  DEPLOYMENT.md next to the runbook, so the difference is a decision somebody
  reads rather than a gap they discover.

  This stack is created AFTER the cluster and deleted BEFORE it: its security
  group lives in the VPC eksctl owns, and eksctl cannot delete a VPC that still
  contains one.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The eksctl cluster's VPC (stack output "VPC").

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >-
      The cluster's PRIVATE subnets. Two or more, in different availability
      zones -- RDS requires that even for a Single-AZ instance, because the
      subnet group defines where it may be placed after a failure.

  ClusterSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: >-
      The EKS cluster security group (stack output "ClusterSecurityGroupId").
      This is the one attached to every managed-node-group pod ENI, so it is
      what the application's traffic actually arrives from.

  SharedNodeSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: >-
      eksctl's shared node security group. Admitted as well as the cluster SG
      because which of the two a packet carries depends on the CNI mode and on
      whether the node group was created by eksctl or added later -- and
      debugging that from a hung JDBC connection is an afternoon.

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: >-
      Generated by up.sh with `openssl rand`, passed on the command line, and
      never written to a file in this repository. NoEcho keeps it out of the
      stack's Parameters view and its events.

      ManageMasterUserPassword (Secrets Manager) was considered and rejected:
      RDS rotates a managed password every 7 days, and the Kubernetes Secret
      holding the copy does not rotate with it. The service would work for a
      week and then fail authentication on a schedule, which is a spectacularly
      confusing failure inside a demo window.

  DBName:
    Type: String
    Default: flightops

  DBUsername:
    Type: String
    Default: flightops

Resources:

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: flight-ops database, private subnets only
      SubnetIds: !Ref PrivateSubnetIds
      Tags:
        - Key: Project
          Value: flight-ops

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL from the EKS cluster only
      VpcId: !Ref VpcId
      # No egress rules are declared, so CloudFormation leaves the default
      # allow-all egress in place. Tightening it buys nothing: the instance
      # initiates no outbound connections.
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ClusterSecurityGroupId
          Description: EKS cluster security group
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref SharedNodeSecurityGroupId
          Description: eksctl shared node security group
      Tags:
        - Key: Project
          Value: flight-ops

  Database:
    Type: AWS::RDS::DBInstance
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            # W1011 wants a {{resolve:secretsmanager:...}} dynamic reference
            # instead of a NoEcho parameter, and it is right in general. Here
            # it would mean a Secrets Manager secret to create, pay for and
            # remember to delete, holding a password that also has to be copied
            # into a Kubernetes Secret by hand -- two sources of truth for one
            # value, in a stack whose whole point is that `down.sh` leaves
            # nothing behind. The password is generated per run by up.sh, never
            # written to disk, and dies with the stack.
            - W1011
    # Both policies are Delete, and both are deliberate. The DEFAULT for
    # DeletionPolicy on an RDS instance is Snapshot -- so a teardown that looks
    # complete leaves a final snapshot behind, billed at storage rates, in a
    # console page nobody opens again. For a demo database seeded from Flyway
    # migrations there is nothing in it worth keeping. For anything with users
    # this would be exactly backwards.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: flight-ops-db
      Engine: postgres
      # Pinned. "postgres" with no version gets whatever RDS defaults to today,
      # which means the version can change between two runs of the same script.
      EngineVersion: '17.11'
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      DBName: !Ref DBName
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !GetAtt DBSecurityGroup.GroupId
      # The single most important line in this file. A publicly accessible
      # database with a generated password is still a database that the entire
      # internet can reach and attempt to log into.
      PubliclyAccessible: false
      MultiAZ: false
      # Zero backups. A demo stack that is deleted in a week does not need
      # point-in-time recovery, and retention > 0 means automated snapshots
      # that outlive the instance and keep billing.
      BackupRetentionPeriod: 0
      DeleteAutomatedBackups: true
      # Skip the final snapshot for the same reason as DeletionPolicy: Delete.
      # The schema is in src/main/resources/db/migration and the data is seed
      # data.
      DeletionProtection: false
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      Tags:
        - Key: Project
          Value: flight-ops

Outputs:
  DbEndpoint:
    Description: Hostname. Private -- only reachable from inside the VPC.
    Value: !GetAtt Database.Endpoint.Address

  DbPort:
    Value: !GetAtt Database.Endpoint.Port

  JdbcUrl:
    Description: >-
      Exactly the value the DB_URL repository variable and the aws overlay
      expect. Copy it verbatim; there is no password in it.
    Value: !Sub 'jdbc:postgresql://${Database.Endpoint.Address}:${Database.Endpoint.Port}/${DBName}'

  DbSecurityGroupId:
    Value: !GetAtt DBSecurityGroup.GroupId
