AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  flight-ops data: one PostgreSQL instance inside the cluster's VPC.

  Demo-shaped: Single-AZ, no backups, no read replica, no Performance
  Insights, deletion policy Delete. Each is wrong for a system with users and
  right for a stack that lives a week and must leave nothing behind.
  doc/DEPLOYMENT.md describes the production shape.

  Created after the cluster and deleted before it: its security group lives in
  the VPC eksctl owns, and eksctl cannot delete a VPC that still contains one.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The eksctl cluster's VPC (stack output "VPC").

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >-
      The cluster's private subnets, two or more in different availability
      zones. RDS requires that even for a Single-AZ instance, because the
      subnet group defines where it may be placed after a failure.

  ClusterSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: >-
      The EKS cluster security group (stack output "ClusterSecurityGroupId").
      It is attached to every managed-node-group pod ENI, so the application's
      traffic arrives from it.

  SharedNodeSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: >-
      eksctl's shared node security group. Admitted beside the cluster SG,
      because which of the two a packet carries depends on the CNI mode and on
      whether eksctl created the node group or it was added later.

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: >-
      Generated by up.sh with `openssl rand`, passed on the command line, and
      never written to a file in this repository. NoEcho keeps it out of the
      stack's Parameters view and its events.

      Not ManageMasterUserPassword (Secrets Manager): RDS rotates a managed
      password every 7 days, and the Kubernetes Secret holding the copy does
      not rotate with it. The service would fail authentication a week in.

  DBName:
    Type: String
    Default: flightops

  DBUsername:
    Type: String
    Default: flightops

Resources:

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: flight-ops database, private subnets only
      SubnetIds: !Ref PrivateSubnetIds
      Tags:
        - Key: Project
          Value: flight-ops

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL from the EKS cluster only
      VpcId: !Ref VpcId
      # No egress rules are declared, so CloudFormation leaves the default
      # allow-all egress in place. Tightening it buys nothing: the instance
      # initiates no outbound connections.
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ClusterSecurityGroupId
          Description: EKS cluster security group
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref SharedNodeSecurityGroupId
          Description: eksctl shared node security group
      Tags:
        - Key: Project
          Value: flight-ops

  Database:
    Type: AWS::RDS::DBInstance
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            # W1011 wants a {{resolve:secretsmanager:...}} reference instead of
            # a NoEcho parameter. Here that is a secret to create, pay for and
            # delete, holding a password also copied into a Kubernetes Secret:
            # two sources of truth for one value. up.sh generates the password
            # per run, never writes it to disk, and it goes with the stack.
            - W1011
    # Both Delete. The RDS default is Snapshot, so a teardown that looks
    # complete leaves a final snapshot billing at storage rates. A demo
    # database built by Flyway migrations holds nothing worth keeping; for
    # anything with users this would be backwards.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: flight-ops-db
      Engine: postgres
      # Pinned. With no version RDS picks its current default, which can change
      # between two runs of the same script.
      EngineVersion: '17.11'
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      DBName: !Ref DBName
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !GetAtt DBSecurityGroup.GroupId
      # A public database with a generated password is still one the whole
      # internet can reach and try to log into.
      PubliclyAccessible: false
      MultiAZ: false
      # No backups. A stack deleted within a week needs no point-in-time
      # recovery, and retention > 0 leaves automated snapshots that outlive the
      # instance and keep billing.
      BackupRetentionPeriod: 0
      DeleteAutomatedBackups: true
      # No final snapshot, as with DeletionPolicy: Delete. The schema is in
      # src/main/resources/db/migration, and the prod profile seeds nothing, so
      # the only rows are what a demo wrote.
      DeletionProtection: false
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      Tags:
        - Key: Project
          Value: flight-ops

Outputs:
  DbEndpoint:
    Description: Hostname. Private, reachable only from inside the VPC.
    Value: !GetAtt Database.Endpoint.Address

  DbPort:
    Value: !GetAtt Database.Endpoint.Port

  JdbcUrl:
    Description: >-
      The value the DB_URL repository variable and the aws overlay expect.
      Copy it as it is; there is no password in it.
    Value: !Sub 'jdbc:postgresql://${Database.Endpoint.Address}:${Database.Endpoint.Port}/${DBName}'

  DbSecurityGroupId:
    Value: !GetAtt DBSecurityGroup.GroupId
