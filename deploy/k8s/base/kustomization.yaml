# The cluster-agnostic half: no registry, account id, queue URL or database
# host, so it applies to any cluster. Render it with
#   kubectl kustomize deploy/k8s/base
#
# Not here: namespace.yaml, because a Namespace is cluster-scoped and CI's
# access entry is namespace-scoped, so every CI deploy would fail on a forbidden
# create (up.sh applies it once); and the Secret, which up.sh creates from
# generated values.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flight-ops

# Added to each resource's metadata.labels only. With includeSelectors false,
# neither the selectors (a Deployment's is immutable) nor the pod template
# change. `app: flight-ops`, which the Service and the PDB select on, is written
# in each manifest.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: flight-ops-service
      app.kubernetes.io/part-of: flight-ops
      app.kubernetes.io/managed-by: kustomize

resources:
  - configmap.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml

# The overlay swaps the registry and tag here, which still works if the
# Deployment gains a second container or an initContainer.
images:
  - name: flight-ops-service
    newTag: "1.2.0"
