# The identity the pods run as, and what IRSA attaches an IAM role to. The
# role-arn annotation names an account id, so it is added by
# deploy/k8s/overlays/aws/serviceaccount-irsa.yaml and the base stays AWS-free.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flight-ops-sa
  labels:
    app: flight-ops
# No Kubernetes API token in the pod. The app never calls the Kubernetes API,
# and a mounted token would hand code running in the container a credential
# for the API server. This removes only that token. IRSA does not use it: the
# EKS pod identity webhook mounts its own projected token, aws-iam-token, and
# points AWS_WEB_IDENTITY_TOKEN_FILE at it whatever this field says, so the
# SQS publisher keeps its role. deployment.yaml sets the same field on the
# pod, where it takes precedence, so it holds even if the pod is pointed at
# another ServiceAccount.
automountServiceAccountToken: false
