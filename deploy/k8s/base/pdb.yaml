# Stops a drain (node upgrade, replacement, spot reclaim) evicting both
# replicas at once: the second eviction waits until a replacement is Ready. It
# covers voluntary disruption only. A node that dies asks no one, which is what
# the Deployment's podAntiAffinity is for.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: flight-ops-pdb
spec:
  # maxUnavailable, because the HPA moves the count between 2 and 4. At 4
  # replicas, `minAvailable: 1` would let three go at once. `maxUnavailable: 1`
  # means one at a time at any count. minAvailable equal to the replica count
  # would block every drain for good.
  maxUnavailable: 1
  selector:
    matchLabels:
      app: flight-ops
