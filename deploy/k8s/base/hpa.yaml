# Needs metrics-server, which a fresh EKS cluster lacks: without it the HPA
# shows `<unknown>/70%` and never scales. up.sh installs it as a managed addon.
#
# The target is a percentage of the CPU request (500m), so 70% is 350m per pod.
# With the default 10% tolerance, a third replica appears once the average
# passes about 385m. There is no CPU limit (see deployment.yaml), so no
# throttle skews the metric.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flight-ops-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flight-ops
  minReplicas: 2
  # The limit is the database. Each pod's Hikari pool holds up to 10
  # connections, and db.t4g.micro allows fewer than 112: the default is
  # DBInstanceClassMemory / 9531392, and DBInstanceClassMemory is less than the
  # 1 GiB class size, because it leaves out what the OS and RDS reserve. Read it
  # with SHOW max_connections. Four pods use 40, leaving room for a migration, a
  # psql session and a rolling update's extra pod. Raise the instance class or
  # lower the pool before raising this.
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Not memory: a JVM heap grows to MaxRAMPercentage and stays, so a memory
    # target would scale out once and never back in.
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      # Five minutes of low CPU before a pod goes. Each scale-down drops
      # connections and each scale-up pays JVM warm-up, so down is slow.
      stabilizationWindowSeconds: 300
