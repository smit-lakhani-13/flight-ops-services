# The unit of teardown: `kubectl delete namespace flight-ops` removes every
# Deployment, Service, HPA, PDB and Secret in it at once. It is also the
# boundary for ResourceQuota, LimitRange, NetworkPolicy and RBAC.
#
# Apply this first, on its own, and never apply the directory:
#
#   kubectl apply -f deploy/k8s/namespace.yaml      # this file
#   deploy/aws/render-aws.sh | kubectl apply -f -   # the application
#
# `kubectl apply -f deploy/k8s/` is not recursive, so it reaches none of the
# application in deploy/k8s/base or deploy/k8s/overlays. It does reach
# deploy/k8s/secret.example.yaml, which has the live Secret's name and
# REPLACE_ME for every value. Nothing fails at once. At the next restart the pod
# crash-loops on the database password (Flyway: password authentication failed).
# With that fixed, every API call gets 401, because {bcrypt}REPLACE_ME matches
# no password.
#
# The namespace has to exist before anything in it, and a directory apply goes
# in alphabetical order without retrying. deploy/aws/up.sh applies this file,
# then creates the Secret; CI applies the rest.
apiVersion: v1
kind: Namespace
metadata:
  name: flight-ops
  labels:
    name: flight-ops
    project: flight-ops
    # The AWS Load Balancer Controller's webhook adds a readiness gate to each
    # pod created here while the Ingress exists. The pod is then Ready only
    # once the ALB reports its target healthy, so a rolling update or a drain
    # cannot take the last target the ALB routes to; with kubelet readiness
    # alone, a new target could still be in its first health checks.
    #
    # The gate is added when a pod is created. Pods already running when the
    # label or the Ingress arrives have none until the next rollout replaces
    # them, and that rollout already waits on the ALB, because its new pods
    # carry the gate. Before the Ingress exists nothing is gated, so the first
    # rollout, which CI makes while up.sh waits at step 10, cannot wait on an
    # ALB that does not exist yet.
    #
    # While the label is on, a pod here is created only if the controller's
    # webhook answers. With the controller down, a rollout or a scale-up
    # waits, with FailedCreate events that name the webhook, and the old pods
    # keep serving.
    #
    # CI's namespace-scoped role cannot apply this file. On a cluster whose
    # namespace predates the label, apply it as shown above, or re-run up.sh,
    # whose step 9 applies it.
    elbv2.k8s.aws/pod-readiness-gate-inject: enabled
