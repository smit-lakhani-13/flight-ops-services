# A template. Copy it, do not edit it in place:
#   cp deploy/k8s/secret.example.yaml deploy/k8s/secret.yaml
#   # put the real values in deploy/k8s/secret.yaml
#   kubectl apply -f deploy/k8s/secret.yaml
#
# deploy/k8s/secret.yaml is in .gitignore. A password in Git history has to be
# rotated, because `git rm` does not remove it. deploy/aws/up.sh creates this
# Secret from generated passwords and never writes it to disk.
#
# Never `kubectl apply -f deploy/k8s/`. This file has the live Secret's name, so
# a directory apply replaces every value with REPLACE_ME. Running pods keep the
# old values. At the next restart the pod crash-loops on the database password
# (Flyway: password authentication failed). With that fixed, every API call gets
# 401.
#
# A Kubernetes Secret is base64-encoded, not encrypted: anyone with `get secret`
# in the namespace reads it, and etcd stores it in plaintext by default.
#   kubectl get secret flight-ops-secret -n flight-ops -o jsonpath='{.data.DB_PASSWORD}' | base64 -d
# Production would use Secrets Manager or SSM with the Secrets Store CSI driver,
# envelope encryption of etcd with KMS, and RDS IAM auth for the one password
# left (IRSA already covers AWS access).
apiVersion: v1
kind: Secret
metadata:
  name: flight-ops-secret
  namespace: flight-ops
type: Opaque
# stringData takes plaintext. With `data`, a trailing newline from `echo` is one
# base64 step away, and PostgreSQL answers with SQLSTATE 28P01.
stringData:
  DB_PASSWORD: "REPLACE_ME"

  # Encoded, with the {id} prefix the DelegatingPasswordEncoder dispatches on,
  # so a leaked Secret is not a working credential. Generate the hash with
  #   htpasswd -bnBC 10 "" "your-password" | tr -d ':\n'
  # and paste it after {bcrypt}. A missing key stops the pod at startup, naming
  # the property: the prod profile has no default, and ApiSecurityProperties
  # rejects an unresolved placeholder.
  API_PASSWORD: "{bcrypt}REPLACE_ME"
  OPS_PASSWORD: "{bcrypt}REPLACE_ME"
