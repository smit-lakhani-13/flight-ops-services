# Maven Wrapper. `./mvnw` downloads and uses the Maven version pinned here, so a
# clone builds with the same Maven this was built with and CI does not need a
# Maven install step.
#
# distributionType=only-script: the wrapper is two shell scripts and this file,
# with no maven-wrapper.jar committed. That is the modern default and it means
# there is no opaque binary in the repository.
#
# distributionSha256Sum is the supply-chain half of the pin. Without it, `./mvnw`
# executes whatever bytes are served from distributionUrl; with it, a substituted
# or corrupted archive fails the build instead of running. Verified against the
# .sha512 published alongside the archive on Maven Central.
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.10.0/apache-maven-3.10.0-bin.zip
distributionSha256Sum=1f6d9909266510f039f59aa0e13dcd2c66da85f043e56276e41f2918f8bddaff
