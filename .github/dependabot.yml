# Dependency updates. The reason this file exists rather than being left to
# manual bumps: lambda/pom.xml has no parent POM, so nothing manages its versions
# and nothing tells you when they go stale. That is exactly the case Dependabot
# covers.
#
# Two things about this config are deliberate and worth knowing before editing.
#
# 1. open-pull-requests-limit is set on EVERY ecosystem. The default is 5 per
#    ecosystem, not 5 overall, so four ecosystems with no explicit limit can open
#    twenty pull requests the first time Dependabot runs on a new repository.
#    Grouping plus an explicit limit keeps a monthly run to a handful.
#
# 2. The ignore rules below are scoped to four specific artifacts, not applied
#    broadly, because an ignore condition suppresses Dependabot SECURITY updates
#    for that dependency as well as version updates. That is a real cost. It is
#    accepted here only where a major bump would contradict a decision the project
#    has already made and documented, so the bump has to be a human's call:
#      - the JDK: pom.xml sets <java.version>21</java.version>, and a major base
#        image bump moves the runtime out from under that
#      - Spring Boot: a major is never a drop-in. The 3.5 -> 4.1 upgrade in this
#        repository moved package names in four places, split three starters out
#        of spring-boot-starter-test, renamed spring-boot-starter-web and moved
#        the whole project from Jackson 2 to Jackson 3. None of that is a merge
#        button, and the same will be true of 5.x
#      - JUnit: lambda/pom.xml has no parent, so its major is whatever this file
#        lets through, while the service module's is whatever Boot's BOM says.
#        The pin exists to keep those two the same number; the comment above
#        <junit.version> gives the reason it matters
#    A major upgrade of any of the four is a deliberate piece of work, not a
#    merge. Everything else — minors, patches, and every dependency not named
#    here — still flows automatically.
version: 2

updates:
  # Root module. Boot's starter parent manages most versions, so the PRs that
  # matter here are the AWS SDK BOM and the parent itself.
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    groups:
      # One PR for the whole SDK rather than one per artifact — the AWS SDK
      # releases almost daily and ungrouped updates bury everything else.
      aws-sdk:
        patterns: ["software.amazon.awssdk:*"]
      spring:
        patterns: ["org.springframework*:*"]
      # Test-only dependencies move together and are reviewed together: a broken
      # test dependency cannot reach production, so these are the cheapest PRs to
      # merge and there is no reason to read them one at a time.
      test:
        patterns: ["org.junit*:*", "org.mockito:*", "org.testcontainers:*"]
    ignore:
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]

  # The Lambda module is a separate, parentless build and needs its own entry;
  # Dependabot does not discover it from the root directory.
  - package-ecosystem: maven
    directory: "/lambda"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: ["dependencies", "lambda"]
    groups:
      aws:
        patterns: ["software.amazon.awssdk:*", "com.amazonaws:*"]
      test:
        patterns: ["org.junit*:*", "org.mockito:*"]
    ignore:
      # Still ignored, for a reason that survived the upgrade even though the
      # version in it did not. Both modules are on JUnit 6.0.3 now: the service
      # gets it from the Boot 4.1.1 BOM, and lambda/pom.xml was moved to match.
      # The rule is not "stay on 5.x", it is "do not let Dependabot move one
      # module's major on its own" - whichever side moves first splits the
      # repository across two JUnit majors, and last time that was this module.
      # Minors and patches on the 6.x line still flow, and a major is a
      # two-line change plus a test run, done deliberately on the day Boot's BOM
      # moves too.
      - dependency-name: "org.junit:junit-bom"
        update-types: ["version-update:semver-major"]

  # The workflow now pins every action to a full commit SHA rather than a major
  # tag, so this ecosystem changed character. A tag is a mutable pointer in
  # somebody else's repository; a SHA is not, and the rationale sits in the
  # workflow itself above the first `uses:`.
  #
  # What that costs is PR volume, and it is the reason this entry matters more
  # than it used to: with a tag, patch releases arrived silently and Dependabot
  # only ever spoke up for a major. With a SHA, *every* release is a PR, and
  # without one this repository would simply freeze on whatever commits were
  # current the day the pins went in - which is the failure mode that makes
  # people give up on SHA pinning and go back to tags. Dependabot understands
  # the pin: it rewrites both the SHA and the trailing version comment.
  #
  # No version numbers in this comment on purpose — the last one said "@v4" and
  # went stale the day the group's first PR merged.
  #
  # Grouped into a single PR: an action bump is a one-line change and reviewing
  # five of them separately is five times the ceremony for the same decision.
  # The limit stays at 1 so a month of patch releases is one PR, not five.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels: ["ci"]
    groups:
      actions:
        patterns: ["*"]

  # Both image tags in the Dockerfile: the maven build stage and the JRE runtime
  # stage. Minor and patch bumps are wanted — that is how the base image picks up
  # OS-level CVE fixes. Major bumps are the JDK version and are pinned; see the
  # header.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: ["docker"]
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "maven"
        update-types: ["version-update:semver-major"]
