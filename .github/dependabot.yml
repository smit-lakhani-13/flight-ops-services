# Dependency updates. lambda/pom.xml has no parent POM, so nothing else manages
# its versions or reports when they go stale.
#
# Two things to know before editing:
#
# 1. Every ecosystem sets open-pull-requests-limit. The default is 5 per
#    ecosystem, so four ecosystems could open twenty pull requests on the first
#    run. Groups and explicit limits keep a monthly run to a handful.
#
# 2. The ignore rules name four artifacts, because an ignore condition also
#    stops Dependabot's security updates for that dependency. Each one is a
#    major bump that would reverse a documented decision, so a person makes it:
#      - the JDK: pom.xml sets <java.version>21</java.version>, and a major base
#        image bump moves the runtime away from it
#      - Spring Boot: a major moves packages and splits or renames starters, so
#        it is never a drop-in
#      - JUnit: lambda/pom.xml copies the version Boot's BOM gives the service
#        module. It is the one rule covering minors and patches too; the comment
#        above it has the reason
#    Every other dependency, and the minors and patches of the other three,
#    still flow automatically.
version: 2

updates:
  # Root module. Boot's starter parent manages most versions, so the PRs that
  # matter here are the AWS SDK BOM and the parent itself.
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    groups:
      # One PR for the whole SDK. It releases almost daily, and ungrouped
      # updates bury everything else.
      aws-sdk:
        patterns: ["software.amazon.awssdk:*"]
      spring:
        patterns: ["org.springframework*:*"]
      # Test-only dependencies cannot reach production, so they move and are
      # reviewed together.
      test:
        patterns: ["org.junit*:*", "org.mockito:*", "org.testcontainers:*"]
    ignore:
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]

  # The Lambda module is a separate, parentless build and needs its own entry;
  # Dependabot does not discover it from the root directory.
  - package-ecosystem: maven
    directory: "/lambda"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: ["dependencies", "lambda"]
    groups:
      aws:
        patterns: ["software.amazon.awssdk:*", "com.amazonaws:*"]
      test:
        patterns: ["org.junit*:*", "org.mockito:*"]
    ignore:
      # Every update type. <junit.version> in lambda/pom.xml copies what Boot's
      # BOM manages for the service module, so the repository runs one JUnit
      # version (6.0.3 on both sides today). Dependabot sees only a parentless
      # POM here and would offer the newest release.
      #
      # So it moves when Boot's BOM moves. Read the managed version with
      # `./mvnw help:evaluate -Dexpression=junit-jupiter.version -DforceStdout`,
      # copy it into lambda/pom.xml, then run both builds.
      #
      # The cost: a junit-bom advisory opens no PR on this module either. JUnit
      # is test scope and never ships in the Lambda artifact, and the service
      # module still gets Boot's advisories.
      - dependency-name: "org.junit:junit-bom"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  # Every action is pinned to a commit SHA (the reason is above the first
  # `uses:` in build-and-deploy.yml), so without this entry the pins freeze.
  # One grouped PR a month rewrites each SHA and the version comment beside it.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels: ["ci"]
    groups:
      actions:
        patterns: ["*"]

  # Both image tags in the Dockerfile, the maven build stage and the JRE
  # runtime. Dependabot keeps a tag's precision and suffix, so 21-jre-alpine can
  # only move to another Java major, and 3.9-eclipse-temurin-21 only to Maven
  # 3.10 or 4. Majors of both are ignored: a Java major changes the JDK (see the
  # header), and Maven 4 is its own upgrade. OS fixes do not come from here.
  # 21-jre-alpine is a floating tag, so a fresh build pulls what it points to.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: ["docker"]
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "maven"
        update-types: ["version-update:semver-major"]
