name: codeql

# Static analysis for the Java in both modules, reported into the repository's
# Security tab.
#
# Advanced setup, which cannot coexist with GitHub's default setup. With both
# on, every upload here fails with "CodeQL analyses from advanced
# configurations cannot be processed when the default setup is enabled".
# Default setup is off (Settings → Code security → Code scanning). If someone
# turns it on, delete this file; default setup does the same job.
#
# A separate file, so the weekly schedule runs without a Maven build and a
# deploy gate, and the build-and-deploy badge means only that it builds and the
# tests pass.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 04:17 UTC. CodeQL ships new queries, so code that was
    # clean at merge can be flagged later without changing. Off the hour,
    # because GitHub queues everything scheduled on it.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      # Writes the analysis into the Security tab.
      security-events: write
      # CodeQL reads workflow run metadata to attribute results to a run.
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialise CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          # One extractor covers Java and Kotlin. It reads both Maven modules,
          # including lambda/, a parentless build the root reactor never
          # reaches.
          languages: java-kotlin

          # Buildless. `autobuild` would run a second full `mvn package`, and
          # CodeQL could then fail because a build step broke. The cost: fewer
          # third-party types resolve, so a data-flow path through a library
          # method may go untraced. The risky paths here are the project's own
          # controllers, repositories and outbox, so I accept that.
          build-mode: none

          # More security queries than the default suite, without the style
          # rules in `security-and-quality`, which would bury a real finding.
          queries: security-extended

      - name: Analyse
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          # Keeps these results beside the Trivy SARIF that build-and-deploy.yml
          # uploads under `trivy-fs`, instead of replacing it.
          category: /language:java-kotlin
