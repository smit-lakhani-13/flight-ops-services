name: codeql

# Static analysis for the Java in both modules and the console's TypeScript,
# reported into the repository's Security tab.
#
# Advanced setup, which cannot coexist with GitHub's default setup. With both
# on, every upload here fails with "CodeQL analyses from advanced
# configurations cannot be processed when the default setup is enabled".
# Default setup is off (Settings → Code security → Code scanning). If someone
# turns it on, delete this file; default setup does the same job.
#
# A separate file, so the weekly schedule runs without a Maven build and a
# deploy gate, and the build-and-deploy badge means only that it builds and the
# tests pass.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 04:17 UTC. CodeQL ships new queries, so code that was
    # clean at merge can be flagged later without changing. Off the hour,
    # because GitHub queues everything scheduled on it.
    - cron: '17 4 * * 1'
  # By hand, for a commit on main that got no push run.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    # One job per language, each a check of its own. The name keeps the exact
    # string `analyze (java-kotlin)` that branch protection requires.
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      # A failure in one language still reports the other.
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]

    permissions:
      contents: read
      # Writes the analysis into the Security tab.
      security-events: write
      # CodeQL reads workflow run metadata to attribute results to a run.
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialise CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          # The Java extractor covers Java and Kotlin, and reads both Maven
          # modules, including lambda/, a parentless build the root reactor
          # never reaches. The JavaScript extractor reads web/.
          languages: ${{ matrix.language }}

          # Buildless for both. For Java, `autobuild` would run a second full
          # `mvn package`, and CodeQL could then fail because a build step
          # broke. The cost: fewer third-party types resolve, so a data-flow
          # path through a library method may go untraced. The risky paths
          # here are the project's own controllers, repositories and outbox,
          # so I accept that. TypeScript is always analysed from source.
          build-mode: none

          # More security queries than the default suite, without the style
          # rules in `security-and-quality`, which would bury a real finding.
          queries: security-extended

      - name: Analyse
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          # A fixed name per language, so the next upload for that language on
          # the same ref replaces it even if this workflow or job is renamed.
          # Trivy's SARIF (`trivy-fs`) is kept apart by tool in any case.
          category: /language:${{ matrix.language }}
