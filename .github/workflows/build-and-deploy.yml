name: build-and-deploy

# One file, seven jobs, and no trigger runs all seven.
#
#   build              every trigger      both Maven modules, suite, coverage, SBOM
#   infra-lint         every trigger      the manifests and CloudFormation that nothing compiles
#   trivy-fs           every trigger      dependency CVEs and committed secrets
#   docs-check         every trigger      citations, links, attribution and privacy sweeps
#   image              every trigger      docker build, a start with no database, the size; never pushed
#   dependency-review  pull_request only  what a pull request ADDS
#   deploy             gated push or      render, apply, wait, smoke
#                      manual run on main
#
# A pull request runs six jobs. A push to main or a manual run on main runs
# five plus a deploy that is skipped unless it is configured. A manual run on
# any other branch runs five. dependency-review diffs a pull request against its
# base, and a push has no base to diff against.
#
# Branch protection is meant to require the five that run on every trigger (a
# repository setting, outside this file). dependency-review stays advisory: it
# is the one gate that can pass on a repository setting instead of the code.
#
# Separate jobs run in parallel, name what broke without anyone opening a log,
# and can be required one by one in branch protection. The file keeps its name
# because the README badge points at it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull request runs: after a force-push, the run in flight
  # tests a commit no one will merge. Never cancel a run on main. It can be
  # inside `kubectl rollout status`, and the next push would deploy on top of a
  # rollout that never settled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: flight-ops-service
  EKS_CLUSTER: flight-ops-cluster
  K8S_NAMESPACE: flight-ops
  DEPLOYMENT: flight-ops

  # One version for both jobs that install kubectl, so infra-lint validates the
  # render with the client that deploy applies it with.
  KUBECTL_VERSION: v1.36.0

# Least privilege at the top; individual jobs raise it where they must. Only
# `deploy` gets id-token, and only trivy-fs gets security-events.
permissions:
  contents: read

# Every action is pinned to a full commit SHA, with the version beside it. A
# tag is a mutable pointer in someone else's repository, and the next run
# executes whatever it points at, with the AWS credentials the deploy job
# assumes. Retagging is how tj-actions/changed-files harvested credentials
# across tens of thousands of repositories in March 2025. Dependabot bumps the
# SHAs and rewrites the version comment with them.

jobs:
  # ---------------------------------------------------------------------------
  build:
    name: build
    runs-on: ubuntu-latest
    # Room for the first run of the day to pull the postgres image. Bounded, so
    # a hung test cannot burn six hours of runner minutes.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          # Caches ~/.m2, keyed on the pom hash.
          cache: maven

      # `verify`, not `test`: it also runs the enforcer, jacoco:check against
      # the coverage floor and the CycloneDX SBOM, so a JAR that cannot be
      # assembled or slipping coverage fails here, and the deploy job, which
      # needs this one, stops before its `docker build`.
      # `./mvnw`, not the runner's Maven: the wrapper pins the version and its
      # SHA-256.
      - name: Build and test
        run: ./mvnw -B clean verify

      # Docker is available on ubuntu-latest, so the Testcontainers classes run
      # here, and CI is the only place the real PostgreSQL path runs: Flyway
      # V1-V8, ddl-auto=validate, SELECT FOR UPDATE under 20-way contention,
      # and the 3s lock_timeout firing. Without Docker they skip, and a skipped
      # test leaves the step above green. This step fails unless all three
      # classes ran with nothing skipped.
      - name: The PostgreSQL tests ran
        run: |
          python3 - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          failed = False
          for name in ("com.smit.flightops.BookingIntegrationTest",
                       "com.smit.flightops.LockTimeoutPostgresTest",
                       "com.smit.flightops.service.OutboxPrunePostgresTest"):
              path = f"target/surefire-reports/TEST-{name}.xml"
              try:
                  suite = ET.parse(path).getroot()
              except (OSError, ET.ParseError) as e:
                  print(f"  {name}: no readable report ({e})")
                  failed = True
                  continue
              tests = int(suite.get("tests", "0"))
              skipped = int(suite.get("skipped", "0"))
              print(f"  {name}: {tests} tests, {skipped} skipped")
              if tests == 0 or skipped > 0:
                  failed = True
          if failed:
              print("::error::the PostgreSQL tests did not all run; is Docker available?")
              sys.exit(1)
          EOF

      # The Lambda is a separate, parentless Maven build that the reactor above
      # does not reach.
      - name: Build and test the Lambda consumer
        run: ./mvnw -B -f lambda/pom.xml clean verify

      # template.yaml deploys the shaded jar as it is, with no `sam build`, so
      # its CodeUri must name the file the build above wrote, and that file
      # must hold the handler class. A renamed artefact or handler fails here
      # instead of at `sam deploy`.
      - name: The SAM template points at the Lambda jar
        run: |
          code_uri=$(sed -n 's/^ *CodeUri: *//p' template.yaml)
          handler=$(sed -n 's/^ *Handler: *//p' template.yaml)
          class="$(printf '%s' "${handler%%::*}" | tr . /).class"
          echo "CodeUri: $code_uri"
          echo "handler: $class"
          [ -f "$code_uri" ] && [ -s "$code_uri" ] \
            || { echo "::error::CodeUri '$code_uri' is not a built file"; exit 1; }
          jar tf "$code_uri" | grep -qx "$class" \
            || { echo "::error::$code_uri does not contain $class"; exit 1; }

      - name: Publish the test reports
        # `always()`: the run that failed is the one whose reports you need.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-reports
          path: |
            target/surefire-reports/
            lambda/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 5

      - name: Publish the coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: target/site/jacoco/
          if-no-files-found: warn
          retention-days: 5

      # `if-no-files-found: error` on a two-path upload fires only when both
      # are missing, and the failure to catch is CycloneDX stopping in one
      # module while the build stays green. So each file is checked by name.
      - name: Both SBOMs exist
        run: |
          missing=0
          for f in target/bom.json lambda/target/bom.json; do
            if [ -s "$f" ]; then
              printf '  %s (%s bytes)\n' "$f" "$(wc -c < "$f" | tr -d ' ')"
            else
              printf '  MISSING or empty: %s\n' "$f" >&2
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || {
            echo 'The CycloneDX plugin did not produce an SBOM for every module.' >&2
            exit 1
          }

      - name: Publish the SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            target/bom.json
            lambda/target/bom.json
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Nothing compiles a Kubernetes manifest or a CloudFormation template, so a
  # typo in either would surface ten minutes into a deploy. This job finds it
  # in about ninety seconds.
  infra-lint:
    name: infra-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      KUBECONFORM_VERSION: v0.8.0
      # From the CHECKSUMS file published beside the v0.8.0 release.
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      # The version cluster.yaml pins, not "master": the development schemas
      # accept fields the cluster this repository creates does not have.
      KUBERNETES_VERSION: 1.36.0
      CFN_LINT_VERSION: 1.57.0
      # Pinned because the runner image's shellcheck drifts, and versions
      # disagree: 0.10 reports SC2015 on `cmd && log ... || true`, 0.11 does
      # not. An unpinned linter turns main red with no shell changed. Bump it,
      # fix what the new version finds, and commit both together.
      SHELLCHECK_VERSION: v0.11.0
      # shellcheck publishes no checksum file, so this was computed from the
      # asset over TLS. It pins the bytes seen once, which still turns a
      # replaced asset into a failed job.
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned: kustomize is built into kubectl and has changed across versions
      # (components, patch merge semantics), and a runner image bump must not
      # change what this repository renders.
      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: ${{ env.KUBECTL_VERSION }}

      # A release asset can be replaced under its tag, so the published sha256
      # is checked before anything is unpacked as root. Refresh it from the
      # release page when the version moves.
      - name: Install kubeconform ${{ env.KUBECONFORM_VERSION }}
        run: |
          curl -sSfL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
          kubeconform -v

      # The render path the deploy job uses, with fake values. It checks that
      # kustomize builds, every placeholder is substituted, and the result is
      # valid against the real API schemas. A surviving placeholder fails inside
      # render-aws.sh (exit 3) before kubeconform runs.
      - name: Validate the rendered AWS overlay
        env:
          AWS_ACCOUNT_ID: '123456789012'
          IMAGE_TAG: ci-lint
          SQS_QUEUE_URL: https://sqs.ap-south-1.amazonaws.com/123456789012/booking-events
          DB_URL: jdbc:postgresql://db.invalid:5432/flightops
        run: |
          deploy/aws/render-aws.sh > /tmp/rendered.yaml
          kubeconform -strict -summary \
            -kubernetes-version "$KUBERNETES_VERSION" /tmp/rendered.yaml

      # The two manifests the overlay leaves out. namespace.yaml is
      # cluster-scoped, so up.sh applies it and CI may not: the deploy role's
      # access entry is namespace-scoped. The ingress is a kustomize Component,
      # which cannot be built on its own, so its one resource is checked
      # directly.
      - name: Validate the manifests the overlay does not include
        run: |
          kubeconform -strict -summary \
            -kubernetes-version "$KUBERNETES_VERSION" \
            k8s/namespace.yaml \
            k8s/components/ingress/ingress.yaml

      # cfn-lint 1.x applies the AWS::Serverless transform itself, so one call
      # covers the SAM template and both stacks. `sam validate` below checks
      # that the tool which deploys it agrees.
      - name: Lint the CloudFormation and SAM templates
        run: |
          pipx install "cfn-lint==${CFN_LINT_VERSION}"
          cfn-lint --version
          cfn-lint template.yaml deploy/aws/foundation.yaml deploy/aws/data.yaml

      - name: Set up the SAM CLI
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          use-installer: true

      # --region, because the SAM translator needs one to resolve pseudo
      # parameters. No credentials are used or needed: this reads a file.
      - name: Validate the SAM template
        run: sam validate --lint --region "$AWS_REGION"

      # `bash -n` as well: shellcheck finds unquoted expansions and bash 3.2
      # array traps, and `bash -n` finds an unbalanced heredoc that shellcheck
      # parses around. One invocation for every tracked script, so shellcheck
      # sees lib.sh and follows the scripts that source it (no SC1091).
      - name: Check every tracked shell script
        run: |
          curl -sSfL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

          mapfile -t scripts < <(git ls-files '*.sh')
          printf 'checking %d scripts:\n' "${#scripts[@]}"
          printf '  %s\n' "${scripts[@]}"
          shellcheck "${scripts[@]}"
          for s in "${scripts[@]}"; do bash -n "$s"; done

      # down.sh's sweep decides whether billing has stopped, and up.sh's checks
      # and the deploy job's ECR lookup decide whether a run goes on. All of
      # them are tested against stubbed aws, kubectl, helm, eksctl and mvnw
      # commands. No credentials are used.
      - name: Test the deploy scripts against stubbed tools
        run: deploy/aws/selftest.sh

  # ---------------------------------------------------------------------------
  trivy-fs:
    name: trivy-fs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      # Files the findings in the Security tab instead of a log that expires.
      security-events: write
      # upload-sarif reads run metadata. A public repository's default token
      # can already do that; a private one or a private fork cannot, and codeql.yml
      # grants the same scope.
      actions: read

    env:
      # A busy runner IP can hit ghcr.io's anonymous pull limit for the Trivy
      # database. This is the upstream default order plus a third mirror, and
      # trivy walks the list.
      TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Two passes. This one writes SARIF for the Security tab and never fails;
      # the next is the gate. The action caches the database between them.
      - name: Scan for vulnerabilities and secrets (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-fs.sarif
          exit-code: '0'
          trivyignores: .trivyignore

      # Push only: a pull request from a fork has a read-only token.
      - name: File the findings in the Security tab
        if: github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      # The gate. `ignore-unfixed` and CRITICAL/HIGH only: a CVE with no
      # released fix is nothing this build can act on, and a gate that blocks
      # on it gets disabled.
      - name: Fail on fixable CRITICAL or HIGH findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: '1'
          trivyignores: .trivyignore

      # Advisory. The misconfiguration rules are written for a production
      # cluster and flag documented decisions here, such as no NetworkPolicy
      # and plain HTTP on the ALB. A gate that fires on those would be muted.
      - name: Scan the infrastructure definitions for misconfiguration (advisory)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM
          format: table
          exit-code: '0'

  # ---------------------------------------------------------------------------
  # What a pull request adds. trivy-fs reports the whole tree; this fails only
  # on what the diff introduces, which a reviewer can act on.
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The action fails with "Dependency review is not supported on this
      # repository" when the dependency graph is off, a red square no commit
      # can fix. So availability is checked first, and a switched-off graph is
      # reported as a warning and a job summary that names the setting.
      - name: Is the dependency graph available?
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/dependency-graph/compare/$BASE_SHA...$HEAD_SHA")

          if [ "$code" = 200 ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo "dependency graph available (HTTP $code)"
            exit 0
          fi

          # 403 and 404 mean the feature is off, the only case tolerated here.
          # Anything else (000 for a connection failure, 5xx, 401) is GitHub
          # having a bad minute. Treating it as "off" would let the gate stop
          # running unnoticed, so it fails and a re-run fixes it.
          case "$code" in
            403|404) : ;;
            *)
              echo "::error title=dependency-review probe failed::the dependency graph API answered $code, which does not mean the feature is disabled — re-run the job"
              exit 1
              ;;
          esac

          echo 'available=false' >> "$GITHUB_OUTPUT"
          {
            echo '### dependency-review did not run'
            echo
            echo "The dependency graph API answered \`$code\`, so this repository has the"
            echo 'dependency graph switched off and there is nothing for the review to read.'
            echo
            echo 'Turn it on at **Settings → Code security → Dependency graph**. Until then'
            echo 'this job passes without checking anything, and every run says so here and'
            echo 'in a warning.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=dependency-review skipped::the dependency graph is disabled for this repository (API returned $code) — enable it at Settings → Code security"

      - name: Review what this pull request adds
        if: steps.graph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # The job summary has the report. A PR comment would need
          # pull-requests: write, which is worth more than the convenience.
          comment-summary-in-pr: never

  # ---------------------------------------------------------------------------
  # The documentation cites files and symbols and links to headings, and every
  # file and commit message must pass the hygiene sweeps. Those are mechanical,
  # so they are checked here.
  docs-check:
    name: docs-check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # scripts/sweeps.sh walks `git log --all`, and a shallow clone would
          # hand it one commit.
          fetch-depth: 0

      - name: Every cited file and symbol resolves
        run: python3 scripts/refcheck.py

      - name: Every link resolves
        run: python3 scripts/linkcheck.py

      - name: Attribution and privacy sweeps
        # Extra patterns come from a repository secret; see the script header.
        # A push without the secret fails rather than skipping.
        env:
          SWEEP_PATTERNS: ${{ secrets.SWEEP_PATTERNS }}
        run: scripts/sweeps.sh

  # ---------------------------------------------------------------------------
  # The image, on every trigger, never pushed. This proves on every pull request
  # to main that the Dockerfile builds and that the image refuses to start
  # without a database. It logs in to nothing and pushes nothing; the deploy job
  # builds its own copy on its own runner.
  image:
    name: image
    runs-on: ubuntu-latest
    # The build stage downloads every dependency: the BuildKit cache mount is
    # empty on a fresh runner.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: docker build --build-arg "GIT_SHA=${{ github.sha }}" -t flight-ops-service:ci .

      # The deploy job's check, against the local tag. See the comment there.
      - name: The image will not start without a database
        run: |
          status=0
          out=$(timeout 120 docker run --rm flight-ops-service:ci 2>&1) || status=$?
          printf '%s\n' "$out" | tail -n 3 | cut -c1-400
          if [ "$status" -ne 0 ] && grep -q "'url' must start with" <<<"$out"; then
            echo "stopped at startup (exit $status) for want of a DB_URL"
          else
            echo "::error::the image did not stop for want of a database (exit $status); does the Dockerfile still set SPRING_PROFILES_ACTIVE=prod?"
            exit 1
          fi

      # In the log as well as the summary: `gh run view --log` reads the log,
      # and the job summary is shown only on the run page. MB is 1,000,000 bytes.
      - name: Record the image size
        run: |
          bytes=$(docker image inspect flight-ops-service:ci --format '{{.Size}}')
          mb=$(awk -v b="$bytes" 'BEGIN { printf "%.1f", b / 1000000 }')
          server=$(docker version --format '{{.Server.Version}}')
          echo "image size: ${mb} MB (${bytes} bytes), docker image inspect, Docker ${server}"
          echo "flight-ops-service:ci is **${mb} MB** (${bytes} bytes) as \`docker image inspect\` reports it on this runner (Docker ${server}). It was not pushed." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Everything below runs only for a configured push or manual run on main.
  deploy:
    name: deploy
    # Not dependency-review: it is skipped on a push, and a skipped dependency
    # skips everything downstream of it.
    needs: [build, infra-lint, trivy-fs, docs-check, image]

    # The `env` context is not available in a job-level `if`, so the
    # condition is written out.
    #
    # DEPLOY_ENABLED is a repository variable, and unset means build and test
    # only. Otherwise the first push to a fresh clone would try to assume a
    # role ARN built from an empty secret, and fail on configuration instead
    # of code. Provision with deploy/aws/up.sh, which prints the four values:
    #   gh secret   set AWS_ACCOUNT_ID --body <account-id>
    #   gh variable set DEPLOY_ENABLED --body true
    #   gh variable set SQS_QUEUE_URL  --body <queue url>
    #   gh variable set DB_URL         --body <jdbc url>
    # Anyone who can read the repository can read a `vars` value, so the
    # account ID is a secret. GitHub holds no password: up.sh writes the
    # database, API and ops passwords straight into a Kubernetes Secret.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
      && vars.DEPLOY_ENABLED == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      # For OIDC: GitHub mints a short-lived signed token, AWS trusts GitHub's
      # provider, and STS returns temporary credentials. No access key is
      # stored anywhere. The role's trust policy pins aud and
      # sub = repo:<owner>/<repo>:ref:refs/heads/main; without the sub pin any
      # GitHub repository could assume it. deploy/aws/foundation.yaml writes
      # the pinned form.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Tagged with the commit SHA, never `latest`, in a repository with
      # IMMUTABLE tags. `kubectl rollout undo` needs the previous tag to still
      # name the image it named, and a second push of the same SHA is refused.
      #
      # Runners and t3.medium nodes are both amd64, so no --platform flag is
      # needed. A plain `docker build` on Apple Silicon produces arm64, and the
      # pod crash-loops with `exec /bin/sh: exec format error`. See README.
      #
      # Immutable tags have one sharp edge. If the deploy fails after the push,
      # "Re-run failed jobs" would stop at `docker push` with
      # ImageTagAlreadyExists. So the tag is looked up first, and if it is there
      # the build and push are skipped. The tag is the commit SHA and cannot
      # move, so the image in the registry is the one this run would build.
      #
      # Any error other than ImageNotFoundException stops the job; the script's
      # header says why, and selftest.sh tests all three outcomes.
      - name: Is this commit already in ECR?
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          echo "IMAGE=$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" >> "$GITHUB_ENV"
          if ! deploy/aws/ecr-image-exists.sh "$ECR_REPOSITORY" "${{ github.sha }}" >> "$GITHUB_OUTPUT"; then
            echo "::error::could not check ECR for ${{ github.sha }}; see the output above"
            exit 1
          fi

      - name: Build the image
        if: steps.image.outputs.exists == 'false'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build \
            --build-arg "GIT_SHA=${{ github.sha }}" \
            -t "$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" .

      # The Dockerfile makes prod the default profile, so the image run with no
      # environment must stop at startup for want of a DB_URL. Under the
      # default profile it would start on H2 and serve until the timeout.
      - name: The image will not start without a database
        if: steps.image.outputs.exists == 'false'
        run: |
          status=0
          out=$(timeout 120 docker run --rm "$IMAGE" 2>&1) || status=$?
          printf '%s\n' "$out" | tail -n 3 | cut -c1-400
          if [ "$status" -ne 0 ] && grep -q "'url' must start with" <<<"$out"; then
            echo "stopped at startup (exit $status) for want of a DB_URL"
          else
            echo "::error::the image did not stop for want of a database (exit $status); does the Dockerfile still set SPRING_PROFILES_ACTIVE=prod?"
            exit 1
          fi

      # Before the push: an image under an immutable tag cannot be replaced,
      # and someone eventually pulls a vulnerable layer left in a registry.
      #
      # CRITICAL only, unlike the filesystem gate. This scans the whole base
      # image, where a HIGH in an OS package the JRE never calls would block
      # every deploy until Temurin ships a rebuild. ECR scans on push too, so a
      # HIGH is still reported.
      - name: Scan the image before pushing it
        if: steps.image.outputs.exists == 'false'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'

      - name: Push the image
        if: steps.image.outputs.exists == 'false'
        run: docker push "$IMAGE"

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: ${{ env.KUBECTL_VERSION }}

      # `apply` of the rendered overlay, not `kubectl set image`, so the
      # repository is the source of truth for all six resources: the ConfigMap,
      # the resource requests and the probe timings, not only the image.
      #
      # k8s/base/deployment.yaml declares no `replicas`. With the field absent,
      # `apply` leaves the live count alone and the HPA keeps ownership, instead
      # of being reset on every push to main.
      #
      # render-aws.sh is the one render path: infra-lint validates its output
      # and this step applies it. It leaves out the Namespace (cluster-scoped,
      # beyond the namespace-scoped access entry) and the Ingress (it bills an
      # ALB, an operator's decision). up.sh applies both.
      - name: Render and apply the manifests
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          IMAGE_TAG: ${{ github.sha }}
          SQS_QUEUE_URL: ${{ vars.SQS_QUEUE_URL }}
          DB_URL: ${{ vars.DB_URL }}
        run: |
          aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

          deploy/aws/render-aws.sh > /tmp/rendered.yaml
          echo 'about to apply:'
          grep -E '^kind:|^  name:' /tmp/rendered.yaml | sed 's/^/  /'

          kubectl apply -f /tmp/rendered.yaml

      # The gate on a successful deploy. Without it the job goes green when the
      # API server accepts the patch, before any new pod has passed a readiness
      # probe. With maxUnavailable: 0 the old pods keep serving while it waits,
      # and a timeout fails the job.
      #
      # 12 minutes, from arithmetic. With maxUnavailable: 0 and maxSurge: 1,
      # pods are replaced one at a time, and one replacement (ECR pull, JVM
      # start, Flyway, the readiness probe's initialDelaySeconds) takes about
      # 90s on a cold node. The HPA's ceiling is 4 replicas, so the slowest
      # legitimate rollout is 4 x 90s = 6 minutes, and 12 leaves room for a
      # slow pull. Raise this if maxReplicas in k8s/base/hpa.yaml is raised.
      - name: Wait for the rollout
        run: |
          kubectl rollout status "deployment/$DEPLOYMENT" \
            -n "$K8S_NAMESPACE" --timeout=12m

      # A completed rollout proves the pods pass their readiness probe, not
      # that the application answers. This asks it for readiness and the
      # OpenAPI document.
      #
      # Through a port-forward, not the ALB: it works whether or not the
      # Ingress exists, needs no DNS, and tests the pod itself. Both endpoints
      # are anonymous (the kubelet has no credentials either), so no secret is
      # needed.
      - name: Smoke test through a port-forward
        run: |
          kubectl -n "$K8S_NAMESPACE" port-forward \
            "deployment/$DEPLOYMENT" 18080:8080 >/tmp/port-forward.log 2>&1 &
          pf=$!
          trap 'kill "$pf" 2>/dev/null || true' EXIT

          # The tunnel takes a moment to come up, and curl fails at once
          # against a closed port, so this retries.
          ready=''
          for _ in $(seq 1 30); do
            if ready=$(curl -sS --max-time 5 \
                http://127.0.0.1:18080/actuator/health/readiness); then
              break
            fi
            ready=''
            sleep 2
          done

          if [ -z "$ready" ]; then
            echo 'the port-forward never answered'
            cat /tmp/port-forward.log
            exit 1
          fi

          echo "readiness: $ready"
          case "$ready" in
            *'"status":"UP"'*) echo '  readiness UP' ;;
            *) echo '  readiness is not UP'; exit 1 ;;
          esac

          docs=$(curl -sS --max-time 10 http://127.0.0.1:18080/v3/api-docs)
          case "$docs" in
            *'"openapi"'*) echo '  OpenAPI document served' ;;
            *) printf '  unexpected /v3/api-docs: %.200s\n' "$docs"; exit 1 ;;
          esac

      # Diagnostics beyond "timed out waiting for the condition". `auth can-i
      # --list` is here because a broken access entry, the likeliest failure on
      # a cluster that worked yesterday, looks like a resource problem.
      - name: Diagnose a failed deploy
        if: failure()
        run: |
          kubectl get pods -n "$K8S_NAMESPACE" -o wide || true
          kubectl describe deployment/"$DEPLOYMENT" -n "$K8S_NAMESPACE" || true
          kubectl logs -n "$K8S_NAMESPACE" -l app=flight-ops \
            --tail=100 --all-containers || true
          kubectl get events -n "$K8S_NAMESPACE" \
            --sort-by=.lastTimestamp | tail -30 || true
          kubectl get ingress -n "$K8S_NAMESPACE" || true
          kubectl auth can-i --list -n "$K8S_NAMESPACE" || true

      # No automatic rollback: that gives a flapping deploy that hides a real
      # bug. With maxUnavailable: 0 a failed rollout has taken no traffic; the
      # old pods are still serving. Roll back by hand after reading the logs:
      #   kubectl rollout undo deployment/flight-ops -n flight-ops
